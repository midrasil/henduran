<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Protótipo da tela Jornadas (docs/ui-ux/15-jornadas.md). Só visual, dados de exemplo; não é código do app. Reaproveita a casca visual do assistente de Nova Jornada. -->
<title>Jornadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: trilho de passos à esquerda (3 passos do MVP), painel central com cabeçalho, conteúdo rolável e rodapé fixo.
   Passo 1: gerador à esquerda e o Mundo editável em abas à direita. Passo 2: seções em coluna única com resumo de
   progresso fixo. Passo 3: duas páginas de pergaminho. Tokens de app/src/styles/tokens.css (ADR-069). */
:root {
  color-scheme: dark;
  --ink-950:#0e0911; --ink-900:#170f1a; --ink-800:#221a26; --ink-700:#2e2233; --ink-600:#432e4a; --ink-400:#8d7a93;
  --purple-800:#45186a; --purple-600:#5a2380; --purple-500:#6e3197; --purple-300:#9a62c4; --purple-200:#c49be3;
  --gold-700:#7a4e12; --gold-600:#a8701c; --gold-400:#f0c050; --gold-200:#f8d878;
  --parch-100:#f8e4c8; --parch-200:#f5dbbb; --parch-300:#e8c69c; --parch-500:#a77d52;
  --brown-900:#2a1b14; --brown-700:#5c4230; --ivory-100:#f4e8d4; --ivory-400:#c8b8ac;
  --red-800:#8a1c12; --red-600:#b8321f; --red-400:#e8604c; --green-300:#7fd88a; --green-700:#2f7a3c; --cyan-300:#6ee7ff;
  --bg: var(--ink-900); --surface: var(--ink-800); --raised: var(--ink-700);
  --text: var(--ivory-100); --muted: var(--ivory-400); --accent: var(--gold-400); --frame: var(--gold-600); --focus: var(--cyan-300);
  --font-pixel: "Pixelify Sans", "Segoe UI", system-ui, sans-serif;
  --font-serif: "Crimson Pro", Georgia, "Times New Roman", serif;
  --fs-xs: .875rem; --fs-sm: 1rem; --fs-md: 1.125rem; --fs-lg: 1.25rem; --fs-xl: 1.5rem;
  --shadow: 4px 4px 0 var(--ink-950);
  --rail-w: 272px;
  --pixel-circle: polygon(30% 0,70% 0,70% 5%,80% 5%,80% 10%,90% 10%,90% 20%,95% 20%,95% 30%,100% 30%,100% 70%,95% 70%,95% 80%,90% 80%,90% 90%,80% 90%,80% 95%,70% 95%,70% 100%,30% 100%,30% 95%,20% 95%,20% 90%,10% 90%,10% 80%,5% 80%,5% 70%,0 70%,0 30%,5% 30%,5% 20%,10% 20%,10% 10%,20% 10%,20% 5%,30% 5%);
  --sb-track: var(--ink-950); --sb-thumb: var(--gold-600); --sb-hi: var(--gold-200); --sb-lo: var(--gold-700);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink-950); color: var(--text); font-family: var(--font-pixel); font-size: var(--fs-sm); line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.px { shape-rendering: crispEdges; display: block; }
svg.ic { width: 16px; height: 16px; flex: none; }
h1, h2, h3, h4, p { margin: 0; }
::-webkit-scrollbar { width: 14px; height: 14px; }
::-webkit-scrollbar-track { background: var(--sb-track); box-shadow: inset 2px 0 0 rgba(0,0,0,.35); }
::-webkit-scrollbar-thumb { background: var(--sb-thumb); border: 3px solid var(--sb-track); box-shadow: inset 2px 2px 0 var(--sb-hi), inset -2px -2px 0 var(--sb-lo); }
::-webkit-scrollbar-thumb:hover { background: var(--sb-hi); }
::-webkit-scrollbar-button { display: none; }
@supports not selector(::-webkit-scrollbar) { * { scrollbar-color: var(--sb-thumb) var(--sb-track); scrollbar-width: thin; } }

/* ------------------------------------------------------------ moldura da tela */
.app { height: 100%; min-width: 0; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); gap: 14px; padding: 14px; background:
  radial-gradient(ellipse 80% 60% at 50% 0%, #2a1840 0%, transparent 70%), var(--ink-950); }
.framed { position: relative; background: var(--ink-900); border: 4px solid var(--frame); box-shadow: inset 0 0 0 2px var(--ink-950), var(--shadow); }
.corner { position: absolute; width: 28px; height: 28px; pointer-events: none; z-index: 3; color: var(--gold-200); }
.corner svg { width: 100%; height: 100%; }
.corner.tl { left: -8px; top: -8px; } .corner.tr { right: -8px; top: -8px; transform: scaleX(-1); }
.corner.bl { left: -8px; bottom: -8px; transform: scaleY(-1); } .corner.br { right: -8px; bottom: -8px; transform: scale(-1); }

/* ---------------------------------------------------------------------- trilho */
.rail { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.rail-top { padding: 20px 18px 8px; text-align: center; }
.rail-top .mark { width: 36px; margin: 0 auto 6px; color: var(--gold-400); }
.rail-top h1 { font-family: var(--font-serif); font-weight: 700; font-size: 1.9rem; line-height: 1.1; color: var(--gold-200); text-shadow: 0 2px 0 var(--gold-700), 3px 4px 0 var(--ink-950); }
.rail-top p { color: var(--muted); font-size: var(--fs-xs); margin-top: 6px; }
.rail-sep { height: 12px; margin: 6px 22px; background: linear-gradient(var(--ink-600), var(--ink-600)) center / 100% 2px no-repeat; position: relative; }
.rail-sep::after { content: ""; position: absolute; left: 50%; top: 2px; width: 8px; height: 8px; margin-left: -4px; background: var(--gold-600); transform: rotate(45deg); }
.steps { list-style: none; margin: 0; padding: 6px 14px 10px; display: grid; gap: 10px; }
.step-btn { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--ink-800); border: 3px solid var(--ink-600); padding: 8px 10px; min-height: 58px; position: relative; }
.step-btn:hover:not(:disabled) { border-color: var(--frame); }
.step-btn:disabled { cursor: default; opacity: .6; }
.step-btn .num { flex: none; width: 36px; height: 36px; display: grid; place-items: center; font-weight: 600; font-size: var(--fs-md); background: var(--ink-950); border: 3px solid var(--ink-600); color: var(--muted); }
.step-btn .lbl { display: grid; line-height: 1.2; min-width: 0; }
.step-btn .lbl b { font-weight: 600; font-size: var(--fs-md); }
.step-btn .lbl small { font-size: var(--fs-xs); color: var(--muted); }
.step-btn[aria-current="step"] { background: var(--purple-600); border-color: var(--gold-400); box-shadow: 3px 3px 0 var(--ink-950); }
.step-btn[aria-current="step"] .num { background: var(--gold-400); color: var(--ink-950); border-color: var(--gold-700); }
.step-btn[aria-current="step"] .lbl small { color: var(--parch-100); }
.step-btn.done .num { background: var(--green-700); color: var(--ivory-100); border-color: var(--green-300); }
.step-btn.warn .lbl small { color: var(--amber-300, #f5b04a); }
.step-btn[aria-current="step"].warn .lbl small { color: var(--gold-200); }
.rail-art { margin-top: auto; position: relative; height: 190px; border-top: 4px solid var(--frame); }
.rail-art canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }

/* ---------------------------------------------------------------------- painel */
.panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.head { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 4px solid var(--ink-600); background: var(--ink-800); }
.head .seal { flex: none; width: 56px; height: 56px; display: grid; place-items: center; background: var(--ink-950); border: 3px solid var(--gold-600); clip-path: polygon(0 20%, 8% 20%, 8% 8%, 20% 8%, 20% 0, 80% 0, 80% 8%, 92% 8%, 92% 20%, 100% 20%, 100% 80%, 92% 80%, 92% 92%, 80% 92%, 80% 100%, 20% 100%, 20% 92%, 8% 92%, 8% 80%, 0 80%); color: var(--gold-400); }
.head .seal svg { width: 30px; height: 30px; }
.head .titles { flex: 1; min-width: 0; }
.head h2 { font-family: var(--font-serif); font-weight: 600; font-size: 1.7rem; line-height: 1.15; color: var(--gold-200); }
.head p { color: var(--muted); font-size: var(--fs-sm); }
.note { flex: none; width: min(330px, 34%); display: flex; gap: 10px; background: var(--parch-200); color: var(--brown-900); border: 3px solid var(--parch-500); padding: 8px 12px; font-family: var(--font-serif); font-size: 1.05rem; line-height: 1.3; }
.note .i { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--brown-700); color: var(--parch-100); font: 600 14px/1 var(--font-pixel); margin-top: 2px; }
.body { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 24px; scroll-behavior: smooth; }
.foot { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 4px solid var(--ink-600); background: var(--ink-800); }
.foot .sp { flex: 1; }
.foot .status { color: var(--muted); font-size: var(--fs-xs); }

/* -------------------------------------------------------------------- botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 6px 18px; background: var(--raised); color: var(--ivory-100);
  border: 3px solid var(--ink-600); box-shadow: 3px 3px 0 var(--ink-950); font-weight: 600; letter-spacing: .02em; }
.btn:hover:not(:disabled) { border-color: var(--frame); background: var(--ink-600); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink-950); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--purple-600); border-color: var(--gold-400); }
.btn.primary:hover:not(:disabled) { background: var(--purple-500); border-color: var(--gold-200); }
.btn.danger { background: var(--red-800); border-color: var(--red-400); }
.btn.sm { min-height: 36px; padding: 2px 12px; font-size: var(--fs-xs); }
.btn.ghost { background: none; border-color: transparent; box-shadow: none; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--gold-200); background: none; border-color: var(--ink-600); }
.btn .spin { width: 16px; height: 16px; border: 3px solid currentColor; border-right-color: transparent; animation: spin .8s steps(8) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn .spin, .gen-dice { animation: none !important; } }

/* ---------------------------------------------------------------- campos */
.field { display: grid; gap: 4px; min-width: 0; }
.field > span.l { font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--gold-200); font-weight: 600; }
.field .hint { font-size: var(--fs-xs); color: var(--muted); }
.field .err { font-size: var(--fs-xs); color: var(--red-400); }
.inp, .field input, .field textarea { width: 100%; background: var(--ink-950); border: 3px solid var(--ink-600); padding: 6px 10px; min-height: 44px; font-family: var(--font-serif); font-size: 1.15rem; line-height: 1.3; resize: vertical; }
.field textarea { min-height: 0; }
.field input:hover, .field textarea:hover { border-color: var(--ink-400); }
.field input:focus, .field textarea:focus { border-color: var(--gold-400); outline: none; box-shadow: 0 0 0 3px rgba(240,192,80,.3); }
.field.bad input, .field.bad textarea { border-color: var(--red-400); }
.field .count { text-align: right; font-size: 12px; color: var(--ink-400); }
.grid2 { align-items: start; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { align-items: start; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stack { display: grid; gap: 14px; }
.sec { display: grid; gap: 12px; background: var(--surface); border: 3px solid var(--ink-600); padding: 14px 16px 16px; scroll-margin-top: 8px; }
.sec > h3 { font-family: var(--font-serif); font-weight: 600; font-size: 1.35rem; color: var(--gold-200); display: flex; align-items: center; gap: 10px; }
.sec > h3 .ok { width: 22px; height: 22px; display: grid; place-items: center; background: var(--green-700); color: var(--ivory-100); }
.sec > h3 .ok svg { width: 14px; height: 14px; }
.sec > h3 .bad { font: 600 12px/1 var(--font-pixel); background: var(--red-800); color: var(--ivory-100); padding: 4px 8px; }
.sec .help { font-family: var(--font-serif); font-size: 1.05rem; color: var(--muted); font-style: italic; line-height: 1.3; }
.sec.parch { background: var(--parch-200); color: var(--brown-900); border-color: var(--parch-500); }
.sec.parch > h3 { color: var(--brown-700); }
.callout { padding: 10px 14px; border: 3px solid; display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-sm); }
.callout.danger { background: rgba(138,28,18,.35); border-color: var(--red-400); }
.callout.warn { background: rgba(168,112,28,.25); border-color: var(--gold-600); }
.pending { background: var(--parch-200); color: var(--brown-900); border: 4px solid var(--parch-500); padding: 12px 16px; margin-bottom: 16px; }
.pending h4 { font-family: var(--font-serif); font-size: 1.2rem; color: var(--red-800); margin-bottom: 6px; }
.pending ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.pending button { background: none; border: 0; padding: 2px 4px; text-align: left; color: var(--brown-900); font-family: var(--font-serif); font-size: 1.1rem; text-decoration: underline dotted; min-height: 30px; }
.pending button:hover { color: var(--red-800); }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--ink-950); border: 2px solid var(--ink-600); padding: 2px 10px; font-size: var(--fs-xs); color: var(--ivory-100); }
.chip.gold { border-color: var(--gold-600); color: var(--gold-200); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; background: var(--red-600); color: var(--ivory-100); font-size: 12px; font-weight: 600; }

/* ----------------------------------------------------------- passo 1: Mundo */
.world { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; align-items: start; }
.body.fill { overflow: hidden; display: flex; flex-direction: column; }
.body.fill .world { flex: 1; min-height: 0; align-items: stretch; grid-template-rows: minmax(0, 1fr); }
.world .gen { position: static; display: flex; flex-direction: column; min-height: 0; gap: 12px; }
.wlist { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start; padding: 2px 6px 4px 2px; }
.wi { text-align: left; display: grid; gap: 2px; background: var(--ink-900); border: 3px solid var(--ink-600); padding: 8px 12px; }
.wi:hover { border-color: var(--frame); }
.wi.on { background: var(--purple-800); border-color: var(--gold-400); box-shadow: 3px 3px 0 var(--ink-950); }
.wi b { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 600; color: var(--gold-200); line-height: 1.15; }
.wi span { font-size: var(--fs-xs); color: var(--muted); }
.wi .tagnew { color: var(--gold-400); font-weight: 600; }
.wempty { padding: 14px 4px; }
.genbox { display: grid; gap: 10px; border-top: 3px solid var(--ink-600); padding-top: 12px; }
.gbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gbtns .btn { padding-inline: 6px; letter-spacing: 0; white-space: nowrap; font-size: .9375rem; gap: 6px; }
.wcol .pending ul { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; } .wcol .pending { max-height: 190px; overflow: auto; }
.seedrow { display: flex; gap: 8px; align-items: flex-end; }
.seedrow .field { flex: 1; }
.wcol { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.wcol .pending { flex: none; }
.wcol .wcard { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.wcol .wpane { flex: 1; min-height: 0; overflow: auto; align-content: start; }
.wcard .whead, .wcard .wtabs { flex: none; }
.rono { align-items: center; flex-wrap: wrap; font-family: var(--font-serif); font-size: 1.05rem; background: rgba(122,78,18,.18); border-color: var(--gold-600); color: var(--brown-900); }
.rono span { flex: 1; min-width: 220px; }
.wcard input[readonly], .wcard textarea[readonly] { cursor: default; background: var(--parch-200); border-style: dashed; }
.gen-art, .gen-dice { display: none; }
.wcol .empty-world { flex: 1; min-height: 0; }
.empty-world { display: grid; place-items: center; text-align: center; gap: 10px; padding: 60px 30px; background: var(--parch-200); color: var(--brown-900); border: 4px dashed var(--parch-500); min-height: 420px; }
.empty-world svg { width: 56px; height: 56px; color: var(--brown-700); }
.empty-world p { font-family: var(--font-serif); font-size: 1.3rem; max-width: 34ch; }
.wcard { background: var(--parch-200); color: var(--brown-900); border: 4px solid var(--parch-500); box-shadow: var(--shadow); --sb-track: var(--parch-300); --sb-thumb: var(--brown-700); --sb-hi: var(--parch-500); --sb-lo: var(--brown-900); }
.wcard .whead { display: grid; gap: 6px; padding: 14px 18px 10px; border-bottom: 3px solid var(--parch-300); }
.wcard .wname { width: 100%; background: transparent; border: 3px solid transparent; font-family: var(--font-serif); font-weight: 700; font-size: 2rem; line-height: 1.1; color: var(--brown-900); padding: 0 6px; min-height: 0; }
.wcard .wname:hover { border-color: var(--parch-500); }
.wcard .wname:focus { outline: none; border-color: var(--brown-700); background: var(--parch-100); }
.wcard .wmeta { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 6px; }
.wcard .wmeta .chip { background: var(--parch-300); border-color: var(--parch-500); color: var(--brown-900); }
.wtabs { display: flex; gap: 6px; padding: 10px 14px 0; border-bottom: 3px solid var(--parch-500); }
.wtab { padding-inline: 10px !important; background: var(--parch-300); color: var(--brown-700); border: 3px solid var(--parch-500); border-bottom: 0; padding: 6px 14px; min-height: 40px; display: flex; gap: 8px; align-items: center; font-weight: 600; margin-bottom: -3px; }
.wtab:hover { background: var(--parch-100); }
.wtab[aria-selected="true"] { background: var(--parch-100); color: var(--brown-900); border-color: var(--brown-700); padding-bottom: 9px; }
.wpane { padding: 16px 18px 18px; display: grid; gap: 14px; }
.wcard .field > span.l { color: var(--brown-700); }
.wcard .field .hint { color: var(--brown-700); }
.wcard .field input, .wcard .field textarea { background: var(--parch-100); border-color: var(--parch-500); color: var(--brown-900); }
.wcard .field input:focus, .wcard .field textarea:focus { border-color: var(--brown-700); box-shadow: 0 0 0 3px rgba(92,66,48,.3); }
.wcard .field.bad input, .wcard .field.bad textarea { border-color: var(--red-600); }
.wcard .field .err { color: var(--red-800); }
.wcard .btn { background: var(--parch-300); color: var(--brown-900); border-color: var(--parch-500); box-shadow: 3px 3px 0 var(--brown-700); }
.wcard .btn:hover:not(:disabled) { background: var(--parch-100); border-color: var(--brown-700); }
.wcard .btn.ghost { background: none; box-shadow: none; border-color: transparent; color: var(--brown-700); }
.wcard .btn.primary { background: var(--purple-600); color: var(--ivory-100); border-color: var(--gold-600); }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; }
.row.one { grid-template-columns: minmax(0, 1fr) auto; }
.wgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.sub { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sub h4 { font-family: var(--font-serif); font-size: 1.25rem; color: var(--brown-900); }
.sub small { color: var(--brown-700); font-size: var(--fs-xs); }
.item { display: grid; gap: 10px; background: var(--parch-100); border: 3px solid var(--parch-500); padding: 12px 14px; }
.item.start { border-color: var(--purple-600); box-shadow: 0 0 0 3px var(--gold-400); }
.item .top { display: flex; align-items: center; gap: 10px; }
.item .top .grow { flex: 1; }
.startbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 2px 12px; background: var(--parch-300); border: 3px solid var(--parch-500); color: var(--brown-900); font-weight: 600; font-size: var(--fs-xs); }
.startbtn:hover { border-color: var(--brown-700); }
.startbtn[aria-pressed="true"] { background: var(--purple-600); color: var(--ivory-100); border-color: var(--gold-400); }

/* ---------------------------------------------------- passo 2: Protagonista */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; align-items: start; }
.asd { position: sticky; top: 0; display: grid; gap: 12px; }
.asd .box { background: var(--surface); border: 3px solid var(--ink-600); padding: 12px 14px; display: grid; gap: 8px; }
.asd h4 { font-family: var(--font-serif); font-size: 1.15rem; color: var(--gold-200); }
.chk { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.chk button { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 2px solid transparent; padding: 4px 6px; text-align: left; min-height: 34px; }
.chk button:hover { border-color: var(--ink-600); background: var(--ink-800); }
.chk .dot { flex: none; width: 18px; height: 18px; display: grid; place-items: center; border: 2px solid var(--ink-600); background: var(--ink-950); }
.chk .dot svg { width: 12px; height: 12px; }
.chk .ok .dot { background: var(--green-700); border-color: var(--green-300); }
.chk .no .dot { border-color: var(--red-400); }
.chk .no small { color: var(--red-400); }

/* ----------------------------------------------- Narrador e editor de texto */
.field > span.l { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

      f.convictions.forEach((c, i) => { if (blank(c.text)) { c.text = aiValue(`form.convictions.${i}.text`); n++; } if (blank(c.pillar)) { c.pillar = aiValue(`form.convictions.${i}.pillar`); n++; } });
