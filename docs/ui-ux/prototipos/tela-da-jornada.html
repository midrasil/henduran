<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Protótipo aprovado em 2026-11-23 (docs/ui-ux/09-tela-da-jornada.md). Só visual, dados de exemplo; não é código do app. -->
<title>Tela da Jornada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: barra fina (Jornada · período · modelo · ⚙) e três colunas (Arcos recolhível · chat · Ficha larga).
   Visual "livro": Em Cena é página de pergaminho; Aduran e Log são a margem escura do cronista.
   Tokens de app/src/styles/tokens.css (ADR-069); visual escuro único. */
:root {
  color-scheme: dark;
  --ink-950:#0e0911; --ink-900:#170f1a; --ink-800:#221a26; --ink-700:#2e2233; --ink-600:#432e4a; --ink-400:#8d7a93;
  --purple-800:#45186a; --purple-600:#5a2380; --purple-500:#6e3197; --purple-300:#9a62c4; --purple-200:#c49be3;
  --gold-700:#7a4e12; --gold-600:#a8701c; --gold-400:#f0c050; --gold-200:#f8d878;
  --parch-100:#f8e4c8; --parch-200:#f5dbbb; --parch-300:#e8c69c; --parch-500:#a77d52;
  --brown-900:#2a1b14; --brown-700:#5c4230; --ivory-100:#f4e8d4; --ivory-400:#c8b8ac;
  --red-800:#8a1c12; --red-400:#e8604c; --green-300:#7fd88a; --cyan-300:#6ee7ff;
  --bg: var(--ink-900); --surface: var(--ink-800); --raised: var(--ink-700);
  --text: var(--ivory-100); --muted: var(--ivory-400); --accent: var(--gold-400); --frame: var(--gold-600); --focus: var(--cyan-300);
  --font-pixel: "Pixelify Sans", "Segoe UI", system-ui, sans-serif;
  --font-serif: "Crimson Pro", Georgia, "Times New Roman", serif;
  --fs-xs: .875rem; --fs-sm: 1rem; --fs-md: 1.125rem; --fs-lg: 1.25rem; --fs-xl: 1.5rem;
  --s1: 8px; --s2: 16px; --s3: 24px;
  --shadow: 4px 4px 0 var(--ink-950);
  --scenes-w: 256px; --sheet-w: 340px;
  --pixel-circle: polygon(30% 0,70% 0,70% 5%,80% 5%,80% 10%,90% 10%,90% 20%,95% 20%,95% 30%,100% 30%,100% 70%,95% 70%,95% 80%,90% 80%,90% 90%,80% 90%,80% 95%,70% 95%,70% 100%,30% 100%,30% 95%,20% 95%,20% 90%,10% 90%,10% 80%,5% 80%,5% 70%,0 70%,0 30%,5% 30%,5% 20%,10% 20%,10% 10%,20% 10%,20% 5%,30% 5%);
  --sb-track: var(--ink-950); --sb-thumb: var(--gold-600); --sb-hi: var(--gold-200); --sb-lo: var(--gold-700);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-pixel); font-size: var(--fs-sm); line-height: 1.45; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.px { shape-rendering: crispEdges; display: block; }

/* barras de rolagem em pixel (WebView2/Chromium; Firefox recebe a versão simples) */
::-webkit-scrollbar { width: 14px; height: 14px; }
::-webkit-scrollbar-track { background: var(--sb-track); box-shadow: inset 2px 0 0 rgba(0,0,0,.35); }
::-webkit-scrollbar-thumb { background: var(--sb-thumb); border: 3px solid var(--sb-track); box-shadow: inset 2px 2px 0 var(--sb-hi), inset -2px -2px 0 var(--sb-lo); }
::-webkit-scrollbar-thumb:hover { background: var(--sb-hi); }
::-webkit-scrollbar-button { display: none; }
::-webkit-scrollbar-corner { background: var(--sb-track); }
@supports not selector(::-webkit-scrollbar) { * { scrollbar-color: var(--sb-thumb) var(--sb-track); scrollbar-width: thin; } }
[data-view="cena"] .stage { --sb-track: var(--parch-300); --sb-thumb: var(--brown-700); --sb-hi: var(--parch-500); --sb-lo: var(--brown-900); }
[data-view="margem"] .stage { --sb-thumb: var(--purple-500); --sb-hi: var(--purple-200); --sb-lo: var(--purple-800); }

/* --------------------------------------------------------------- barra superior */
.top { display: flex; align-items: center; gap: var(--s2); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ink-950); border-bottom: 4px solid var(--frame); box-shadow: 0 2px 0 var(--gold-200) inset; position: relative; }
.top .jname { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; }
.top .jname b { font-family: var(--font-serif); font-size: var(--fs-xl); font-weight: 600; color: var(--gold-200); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .jname span { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
.model-btn { display: flex; align-items: center; gap: 8px; background: var(--ink-800); border: 3px solid var(--ink-600); padding: 6px 12px; min-height: 44px; }
.model-btn:hover { border-color: var(--frame); }
.model-btn .led { width: 10px; height: 10px; box-shadow: 0 0 0 2px var(--ink-950); }
.model-btn[data-s="ok"] .led { background: var(--green-300); }
.model-btn[data-s="off"] .led { background: var(--red-400); }
.model-btn small { color: var(--muted); font-size: var(--fs-xs); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: var(--raised); border: 3px solid var(--frame); box-shadow: 3px 3px 0 var(--ink-950); position: relative; padding: 0; }
.icon-btn:hover { background: var(--ink-600); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="true"] { background: var(--purple-600); border-color: var(--gold-200); }
.icon-btn.danger:hover { background: var(--red-800); }
.icon-btn .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px; background: var(--gold-400); color: var(--ink-950); font-size: 11px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--ink-950); }
.cog-menu { position: fixed; z-index: 40; top: 64px; right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border: 3px solid var(--frame); box-shadow: var(--shadow); min-width: 230px; padding: 4px; }
.cog-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; min-height: 44px; }
.cog-menu button:hover { background: var(--raised); color: var(--gold-200); }
.cog-menu small { display: block; color: var(--muted); font-size: var(--fs-xs); }
/* tooltip em pixel */
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; z-index: 70; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap;
  background: var(--ink-950); color: var(--ivory-100); border: 2px solid var(--gold-400); padding: 2px 8px; font: 400 12px/1.4 var(--font-pixel); pointer-events: none; }
.tip-below[data-tip]:hover::after, .tip-below[data-tip]:focus-visible::after { bottom: auto; top: calc(100% + 6px); }

/* --------------------------------------------------- período: três propostas */
.period-trail { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--ink-800); border: 3px solid var(--ink-600); min-height: 44px; }
.period-trail .day { font-size: var(--fs-xs); color: var(--gold-200); margin-right: 6px; white-space: nowrap; }
.period-trail i { width: 28px; height: 28px; display: grid; place-items: center; opacity: .35; }
.period-trail i.past { opacity: .6; }
.period-trail i.now { opacity: 1; background: var(--ink-950); outline: 2px solid var(--gold-400); }
.period-trail i svg { width: 20px; height: 20px; }
.period-wheel { display: flex; align-items: center; gap: 10px; padding: 2px 10px 2px 4px; background: var(--ink-800); border: 3px solid var(--ink-600); min-height: 44px; }
.period-wheel canvas { width: 40px; height: 40px; image-rendering: pixelated; }
.period-wheel span { font-size: var(--fs-xs); line-height: 1.2; }
.period-wheel b { display: block; color: var(--gold-200); font-weight: 600; }
.sky-band { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
.stage-head.with-sky { color: var(--ivory-100); min-height: 96px; border-bottom: 4px solid var(--brown-700) !important; background: none !important; }
.stage-head.with-sky > * { position: relative; z-index: 1; }
.stage-head.with-sky .where { text-shadow: 2px 2px 0 rgba(0,0,0,.7); }
.stage-head.with-sky .eyebrow { color: var(--gold-200) !important; }
.stage-head.with-sky p { color: var(--parch-100) !important; }
.stage-head.with-sky .icon-btn { background: rgba(14,9,17,.78) !important; border-color: var(--gold-400) !important; box-shadow: 3px 3px 0 rgba(0,0,0,.5) !important; }
.stage-head.with-sky .icon-btn svg { color: var(--gold-200) !important; }

/* --------------------------------------------- céu do período: variações */
.nav-sky { position: absolute; left: 0; top: 0; image-rendering: pixelated; z-index: 0; pointer-events: none; }
.top > *:not(.nav-sky) { position: relative; z-index: 1; }
.top.sky-on { min-height: 76px; background: var(--ink-950); }
.top.sky-on .jname { align-self: stretch; align-items: center; }
.top.sky-on .jname b, .top.sky-on .jname span { text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; }
.top.sky-on .jname span { color: var(--ivory-100); }
.top.sky-on .model-btn { background: rgba(14,9,17,.82); }
.period-chip { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; background: rgba(14,9,17,.82); border: 3px solid var(--ink-600); min-height: 44px; }
.period-chip svg { width: 28px; height: 28px; }
.period-chip span { font-size: var(--fs-xs); line-height: 1.1; color: var(--muted); }
.period-chip b { display: block; color: var(--gold-200); font-weight: 600; }
.stage-head.with-sky { min-height: 132px; align-items: flex-start; padding-top: 14px; padding-bottom: 34px; }
.stage-head.with-sky .sky-band { position: absolute; left: 0; top: 0; image-rendering: pixelated; z-index: 0; }
.stage-head.over-sky { background: transparent !important; border-bottom: 0 !important; min-height: 112px; align-items: flex-start; }
.stage-head.over-sky .where { text-shadow: 2px 2px 0 rgba(0,0,0,.8); color: var(--ivory-100); }
.stage-head.over-sky .eyebrow { color: var(--gold-200) !important; }
.stage-head.over-sky p { color: var(--parch-100) !important; }
.stage-head.over-sky .icon-btn { background: rgba(14,9,17,.78) !important; border-color: var(--gold-400) !important; color: var(--gold-200) !important; box-shadow: 3px 3px 0 rgba(0,0,0,.5) !important; }
.stage-sky { position: absolute; left: 0; top: 0; image-rendering: pixelated; z-index: 0; pointer-events: none; }
.stage.sky-bg > *:not(.stage-sky) { position: relative; z-index: 1; }
.stage.sky-bg .log { margin: 0 28px; background: var(--parch-200); border: 3px solid var(--parch-500); border-bottom: 0; box-shadow: 0 0 0 3px rgba(14,9,17,.35); }
.stage.sky-bg .composer { margin: 0 28px 20px; border: 3px solid var(--parch-500); }
.window { flex: 0 0 auto; width: 120px; height: 84px; position: relative; padding: 4px; background: var(--brown-700); box-shadow: 0 0 0 3px var(--gold-600), 4px 4px 0 3px var(--parch-500);
  clip-path: polygon(0 18%, 8% 18%, 8% 8%, 18% 8%, 18% 0, 82% 0, 82% 8%, 92% 8%, 92% 18%, 100% 18%, 100% 100%, 0 100%); }
.window canvas { position: absolute; left: 4px; top: 4px; image-rendering: pixelated; clip-path: polygon(0 18%, 8% 18%, 8% 8%, 18% 8%, 18% 0, 82% 0, 82% 8%, 92% 8%, 92% 18%, 100% 18%, 100% 100%, 0 100%); }
.window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--brown-700); }
.stage-head h1 .pen { display: inline-grid; vertical-align: middle; width: 26px; height: 26px; margin-left: 4px; opacity: .55; border-color: transparent; }
.stage-head h1 .pen:hover, .stage-head h1 .pen:focus-visible { opacity: 1; border-color: currentColor; }
.stage-head h1 .pen svg { width: 14px; height: 14px; }
.title-edit { display: flex; gap: 6px; margin-top: 2px; }
.title-edit input { font-family: var(--font-serif); font-size: var(--fs-xl); font-weight: 600; background: var(--parch-100); color: var(--brown-900); border: 3px solid var(--brown-700); padding: 0 8px; min-width: 0; width: min(420px, 100%); }

/* ----------------------------------------------------------------- trilhas */
.track { display: grid; gap: 6px; }
.track .top-line { display: flex; justify-content: space-between; align-items: baseline; }
.track .tname { font-size: var(--fs-xs); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.track.v .tname { color: #ff8a70; } .track.w .tname { color: #8fc0ff; }
.track .top-line em { font-style: normal; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); color: var(--ivory-100); }
.tcells { display: flex; flex-wrap: wrap; gap: 4px; }
.tcells .cell { display: grid; place-items: end center; height: 30px; }
.tcells.icons-v svg { width: 26px; height: 24px; }
.tcells.icons-w svg { width: 22px; height: 28px; }
.tcells .cell.full svg { filter: drop-shadow(0 0 0 transparent); }
.tcells.icons-v .cell.full svg { filter: drop-shadow(0 0 3px rgba(224,52,42,.45)); }
.tcells.icons-w .cell.full svg { filter: drop-shadow(0 0 4px rgba(60,140,240,.55)); }
.tcells.icons-w .cell.full:nth-child(odd) svg { animation: flick 1.6s steps(2) infinite; }
@keyframes flick { 50% { transform: translateY(-1px); } }
@media (prefers-reduced-motion: reduce) { .tcells .cell svg { animation: none !important; } }
.track .legend svg.ti.v { width: 14px; height: 13px; } .track .legend svg.ti.w { width: 12px; height: 15px; }

.tbar { display: flex; gap: 2px; padding: 3px; background: var(--ink-950); border: 3px solid var(--frame); box-shadow: inset 0 2px 0 rgba(0,0,0,.6); height: 24px; }
.tbar i { flex: 1; position: relative; }
.tbar.v i.full { background: linear-gradient(#ff9a80 0 3px, #d83a2a 3px calc(100% - 3px), #8a1c12 calc(100% - 3px)); }
.tbar.w i.full { background: linear-gradient(#a8d0ff 0 3px, #3a78d8 3px calc(100% - 3px), #1c3f86 calc(100% - 3px)); }
.tbar.v i.sup { background: repeating-linear-gradient(135deg, #f0c4b8 0 3px, #8a1c12 3px 5px); }
.tbar.w i.sup { background: repeating-linear-gradient(135deg, #c4d6f2 0 3px, #1c3f86 3px 5px); }
.tbar.v i.agr { background: repeating-linear-gradient(45deg, #ff6a50 0 2px, transparent 2px 6px), repeating-linear-gradient(135deg, #ff6a50 0 2px, #3a0e0e 2px 6px); }
.tbar.w i.agr { background: repeating-linear-gradient(45deg, #8fc0ff 0 2px, transparent 2px 6px), repeating-linear-gradient(135deg, #8fc0ff 0 2px, #0f1a38 2px 6px); }
.sw { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--ink-950); }
.sw.v.sup { background: repeating-linear-gradient(135deg, #f0c4b8 0 2px, #8a1c12 2px 4px); } .sw.w.sup { background: repeating-linear-gradient(135deg, #c4d6f2 0 2px, #1c3f86 2px 4px); }
.sw.v.agr { background: #3a0e0e; box-shadow: inset 0 0 0 2px #ff6a50; } .sw.w.agr { background: #0f1a38; box-shadow: inset 0 0 0 2px #8fc0ff; }
.track .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; min-height: 16px; }
.track .legend span { display: inline-flex; gap: 5px; align-items: center; }
.track .legend svg { width: 14px; height: 14px; }
.track .legend .state { color: var(--ivory-100); background: var(--red-800); padding: 0 6px; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }

/* ----------------------------------------------------------------------- shell */
.game { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--scenes-w) minmax(0,1fr) var(--sheet-w); gap: var(--s2);
  padding-block: var(--s2); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.game[data-scenes="min"] { --scenes-w: 64px; }
.panel { background: var(--surface); border: 4px solid var(--frame); box-shadow: var(--shadow); min-height: 0; display: flex; flex-direction: column; position: relative; }
.panel::before, .panel::after { content: ""; position: absolute; width: 8px; height: 8px; background: var(--gold-200); top: -6px; left: -6px; box-shadow: 0 0 0 2px var(--ink-950); z-index: 3; }
.panel::after { left: auto; right: -6px; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px var(--s2); border-bottom: 2px solid var(--ink-950); background: var(--ink-800); min-height: 48px; }
.phead h2 { margin: 0; font-size: var(--fs-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.mini { width: 32px; height: 32px; display: grid; place-items: center; background: transparent; border: 2px solid var(--ink-600); padding: 0; }
.mini:hover { border-color: var(--frame); }
.mini svg { width: 16px; height: 16px; }

/* --------------------------------------------------------------------- arcos */
.arc { border-bottom: 2px solid var(--ink-950); }
.arc summary { list-style: none; cursor: pointer; padding: 10px var(--s2) 8px; display: grid; gap: 2px; }
.arc summary::-webkit-details-marker { display: none; }
.arc summary .lab { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: flex; gap: 6px; align-items: center; }
.arc summary .lab::before { content: "▸"; color: var(--gold-200); }
.arc[open] summary .lab::before { content: "▾"; }
.arc summary .amb { font-family: var(--font-serif); font-size: var(--fs-md); line-height: 1.2; }
.arc summary .st { font-size: 11px; color: var(--muted); }
.arc.old summary .amb { color: var(--muted); }
.arc ol { list-style: none; margin: 0; padding: 0 var(--s1) var(--s1) 14px; display: grid; gap: 4px; position: relative; }
.arc ol::before { content: ""; position: absolute; left: 22px; top: 4px; bottom: 14px; border-left: 2px dotted var(--ink-600); }
.scene-card { width: 100%; text-align: left; background: var(--ink-900); border: 2px solid var(--ink-700); padding: 6px 8px; display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; min-height: 40px; position: relative; color: var(--muted); }
.scene-card svg { width: 20px; height: 20px; }
.scene-card .ttl { font-family: var(--font-serif); font-size: var(--fs-md); line-height: 1.15; }
.scene-card:hover { border-color: var(--frame); color: var(--ivory-100); }
.scene-card.live { background: var(--parch-200); color: var(--brown-900); border: 2px solid var(--gold-400); box-shadow: 3px 3px 0 var(--ink-950), inset 0 0 0 2px var(--parch-100); }
.scene-card.live::after { content: ""; position: absolute; right: 8px; top: -2px; width: 8px; height: 16px; background: var(--red-800); clip-path: polygon(0 0,100% 0,100% 100%,50% 70%,0 100%); }
.scene-card[aria-current="true"]:not(.live) { border-color: var(--gold-400); color: var(--ivory-100); background: var(--raised); }
.rail { display: grid; gap: 6px; padding: var(--s1); justify-items: center; }
.rail button { width: 40px; height: 40px; background: var(--ink-900); border: 2px solid var(--ink-700); display: grid; place-items: center; padding: 0; }
.rail button svg { width: 20px; height: 20px; }
.rail button.live { background: var(--parch-200); border-color: var(--gold-400); }
.rail button[aria-current="true"]:not(.live) { border-color: var(--gold-400); }
.rail hr { width: 32px; border: 0; border-top: 2px dotted var(--ink-600); margin: 2px 0; }

/* ---------------------------------------------------------------- centro */
.stage { overflow: hidden; }
.stage-head { padding: 12px 12px 12px var(--s2); display: flex; gap: var(--s2); align-items: center; justify-content: space-between; border-bottom: 2px solid var(--ink-950); position: relative; overflow: hidden; }
.stage-head .where { min-width: 0; flex: 1; }
.eyebrow { font-size: var(--fs-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.eyebrow svg { width: 16px; height: 16px; }
.stage-head h1 { margin: 2px 0 0; font-family: var(--font-serif); font-weight: 600; font-size: var(--fs-xl); line-height: 1.15; text-wrap: balance; }
.stage-head p { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--muted); }
.head-tools { display: flex; gap: 8px; align-items: center; }
.head-tools .sep { width: 2px; height: 32px; background: var(--ink-600); margin: 0 2px; }
.btn { border: 3px solid var(--ink-950); background: var(--raised); padding: 8px 14px; min-height: 44px; box-shadow: inset -2px -2px 0 rgba(0,0,0,.35), inset 2px 2px 0 rgba(255,255,255,.08); }
.btn:hover { background: var(--ink-600); }
.btn.primary { background: var(--purple-600); color: var(--ivory-100); }
.btn.primary:hover { background: var(--purple-500); }
.btn.ghost { background: transparent; border-color: var(--frame); color: var(--gold-200); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.log { flex: 1; overflow: auto; min-height: 0; padding: var(--s3) var(--s3) var(--s2); display: flex; flex-direction: column; gap: var(--s3); }
.msg { max-width: 100%; position: relative; }
.msg .who { font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.msg .body { font-family: var(--font-serif); font-size: var(--fs-lg); line-height: 1.5; }
.msg .body p { margin: 0 0 .5em; }
.msg .body p:last-child { margin-bottom: 0; }
.msg .body q { quotes: "“" "”"; font-weight: 600; }
.msg.player { align-self: flex-end; width: fit-content; max-width: 100%; }
.msg.player .body { background: var(--purple-800); color: var(--ivory-100); border: 3px solid var(--ink-950); padding: 10px 14px; font-size: var(--fs-md); box-shadow: 3px 3px 0 var(--ink-950); white-space: pre-wrap; }
.msg.player .who { text-align: right; color: var(--purple-300); }
.msg.cut .body::after { content: " …"; }
.cutnote { font-size: var(--fs-xs); color: var(--muted); margin-top: 4px; }
.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
/* ações: discretas, só ao passar o mouse ou com foco do teclado */
.actions { position: absolute; top: -4px; right: 0; display: flex; gap: 2px; opacity: 0; pointer-events: none; transition: opacity 100ms; background: var(--ink-950); border: 2px solid var(--ink-600); padding: 2px; }
.msg.player .actions { right: auto; left: 0; }
.msg:hover .actions, .msg:focus-within .actions { opacity: 1; pointer-events: auto; }
.actions button { width: 26px; height: 26px; background: transparent; border: 0; display: grid; place-items: center; color: var(--ivory-400); padding: 0; }
.actions button:hover { color: var(--gold-200); background: var(--ink-700); }
.actions button svg { width: 14px; height: 14px; }
[data-view="cena"] .actions { background: var(--parch-100); border-color: var(--parch-500); }
[data-view="cena"] .actions button { color: var(--brown-700); }
[data-view="cena"] .actions button:hover { color: var(--red-800); background: var(--parch-300); }
/* campo de escrita: uma linha que cresce */
.composer { padding: 12px var(--s2) 14px; border-top: 2px solid var(--ink-950); }
.field { display: flex; align-items: flex-end; gap: 6px; background: var(--ink-950); border: 3px solid var(--frame); box-shadow: inset 2px 2px 0 rgba(0,0,0,.5); padding: 4px 4px 4px 12px; }
.field:focus-within { border-color: var(--gold-200); }
.field textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: none; background: transparent; color: var(--text); font-family: var(--font-serif); font-size: var(--fs-md); line-height: 1.4; padding: 6px 0; height: 37px; max-height: 190px; overflow-y: auto; }
.field textarea::placeholder { color: var(--ink-400); font-style: italic; }
.send { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; background: var(--purple-600); border: 2px solid var(--ink-950); box-shadow: inset 2px 2px 0 var(--purple-300), inset -2px -2px 0 var(--purple-800); padding: 0; color: var(--ivory-100); }
.send:hover { background: var(--purple-500); }
.send[disabled] { background: var(--ink-700); box-shadow: none; color: var(--ink-400); cursor: not-allowed; }
.send svg { width: 18px; height: 18px; }
.field-hint { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
.field.off { border-color: var(--ink-600); }
[data-view="cena"] .composer { background: var(--parch-300); border-top: 3px double var(--parch-500); }
[data-view="cena"] .field { background: var(--parch-100); border-color: var(--brown-700); box-shadow: inset 2px 2px 0 rgba(92,66,48,.25); }
[data-view="cena"] .field:focus-within { border-color: var(--red-800); }
[data-view="cena"] .field textarea { color: var(--brown-900); }
[data-view="cena"] .field textarea::placeholder { color: var(--parch-500); }
[data-view="cena"] .field-hint { color: var(--brown-700); }
.readonly { margin: var(--s2) var(--s3) 0; padding: 10px 14px; border: 2px dashed var(--ink-400); color: var(--muted); font-size: var(--fs-xs); display: flex; justify-content: space-between; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.summary { border: 3px double var(--frame); padding: var(--s2); font-family: var(--font-serif); font-size: var(--fs-md); }
.summary .eyebrow { margin-bottom: 4px; }
.proposal { border: 3px solid var(--gold-400); background: var(--ink-950); padding: var(--s2); max-width: 60ch; box-shadow: var(--shadow); display: grid; gap: 8px; }
.proposal dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
.proposal dt { color: var(--accent); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .1em; padding-top: 2px; }
.proposal dd { margin: 0; font-family: var(--font-serif); font-size: var(--fs-md); }
.proposal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.new-place { color: var(--green-300); font-family: var(--font-pixel); font-size: var(--fs-xs); margin-left: 6px; }
.pending { margin: auto; max-width: 52ch; text-align: center; display: grid; gap: var(--s2); padding: var(--s3); }
.pending h3 { margin: 0; font-family: var(--font-serif); font-size: var(--fs-xl); }
.pending p { margin: 0; }
.warn { border: 2px solid var(--gold-600); padding: 10px 14px; text-align: left; font-size: var(--fs-xs); background: rgba(240,192,80,.08); }
.events { list-style: none; margin: 0; padding: var(--s3); display: grid; gap: 10px; }
.events li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; border-bottom: 1px dotted var(--ink-600); padding-bottom: 10px; }
.events .ico { width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--purple-300); color: var(--purple-200); }
.events .ico svg { width: 16px; height: 16px; }
.events b { color: var(--gold-200); font-weight: 600; }
.events time { display: block; color: var(--muted); font-size: var(--fs-xs); }
/* página viva */
[data-view="cena"] .stage { background: var(--parch-200); color: var(--brown-900); border-color: var(--parch-500); }
[data-view="cena"] .stage-head { background: linear-gradient(var(--parch-300), var(--parch-200)); border-bottom: 3px double var(--parch-500); }
[data-view="cena"] .eyebrow { color: var(--red-800); }
[data-view="cena"] .stage-head p, [data-view="cena"] .readonly, [data-view="cena"] .cutnote, [data-view="cena"] .pending p { color: var(--brown-700); }
[data-view="cena"] .readonly { border-color: var(--parch-500); }
[data-view="cena"] .msg.narr .who { color: var(--red-800); }
[data-view="cena"] .msg.narr.first .body p:first-child::first-letter { float: left; font-size: 3.2em; line-height: .85; padding: 4px 8px 0 0; color: var(--red-800); font-weight: 600; }
[data-view="cena"] .summary { border-color: var(--parch-500); }
[data-view="cena"] .btn.ghost { color: var(--red-800); border-color: var(--brown-700); }
[data-view="cena"] .warn { border-color: var(--brown-700); color: var(--brown-900); }
[data-view="cena"] .stage-head .icon-btn { background: var(--parch-100); border-color: var(--brown-700); box-shadow: 3px 3px 0 var(--parch-500); color: var(--brown-900); }
[data-view="cena"] .stage-head .icon-btn:hover { background: var(--parch-300); }
[data-view="cena"] .stage-head .icon-btn.danger:hover { background: #e9b3a2; }
[data-view="cena"] .head-tools .sep { background: var(--parch-500); }
/* margem do cronista */
[data-view="margem"] .stage { background: var(--ink-800) repeating-linear-gradient(transparent 0 31px, rgba(154,98,196,.10) 31px 32px); border-color: var(--purple-300); border-style: double; border-width: 6px; }
[data-view="margem"] .stage-head { background: var(--ink-900); }
[data-view="margem"] .msg.narr .body { font-style: italic; border-left: 3px dotted var(--purple-300); padding-left: 14px; }
[data-view="margem"] .msg.narr .who { color: var(--purple-300); }
[data-view="margem"] .field { border-color: var(--purple-300); }
.stage-head .icon-btn { color: var(--gold-200); }
.veil { position: absolute; inset: 0; z-index: 20; pointer-events: none; background: var(--parch-100); animation: page 700ms steps(7) both; transform-origin: left center; }
@keyframes page { 0% { transform: scaleX(0); } 50% { transform: scaleX(1); } 100% { transform: scaleX(0); transform-origin: right center; } }
@media (prefers-reduced-motion: reduce) { .veil { display: none; } .actions { transition: none; } .typing::after { animation: none; } }

/* ------------------------------------------------------------------ Ficha */
.sheet .hero { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding: var(--s2); border-bottom: 2px solid var(--ink-950); background: linear-gradient(180deg, var(--ink-700), var(--ink-800)); }
.portrait { position: relative; width: 96px; height: 96px; padding: 0; border: 0; background: none; }
.portrait .ring { position: absolute; inset: 0; clip-path: var(--pixel-circle); background: var(--gold-200); }
.portrait .ring2 { position: absolute; inset: 4px; clip-path: var(--pixel-circle); background: var(--gold-700); }
.portrait .pic { position: absolute; inset: 8px; clip-path: var(--pixel-circle); background: var(--purple-800); display: grid; place-items: center; overflow: hidden; }
.portrait .pic img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.portrait .pic b { font-family: var(--font-serif); font-size: 2rem; color: var(--gold-200); }
.portrait .edit { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; background: var(--ink-950); border: 2px solid var(--gold-400); display: grid; place-items: center; }
.portrait .edit svg { width: 14px; height: 14px; }
.portrait.lg { width: 140px; height: 140px; }
.portrait.lg .pic b { font-size: 3rem; }
.sheet .name, .fs-name { font-family: var(--font-serif); font-size: var(--fs-xl); font-weight: 600; line-height: 1.1; }
.sheet .concept, .fs-concept { font-size: var(--fs-xs); color: var(--muted); margin-top: 4px; }
.sec { padding: 12px var(--s2) 14px; border-bottom: 2px solid var(--ink-950); display: grid; gap: 10px; }
.sec-title { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.sec-title::after { content: ""; flex: 1; height: 2px; background: repeating-linear-gradient(90deg, var(--gold-700) 0 4px, transparent 4px 8px); }
.attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.attr { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; background: var(--ink-900); border: 2px solid var(--ink-600); padding: 6px 8px; box-shadow: inset 2px 2px 0 rgba(255,255,255,.05), inset -2px -2px 0 rgba(0,0,0,.4); }
.attr .gem { width: 30px; height: 30px; display: grid; place-items: center; background: var(--ink-950); border: 2px solid var(--frame); font-size: var(--fs-lg); font-weight: 600; color: var(--gold-200); font-variant-numeric: tabular-nums; }
.attr.esp .gem { border-color: var(--purple-300); color: var(--purple-200); }
.attr .an { font-size: var(--fs-xs); line-height: 1.1; }
.pips { display: flex; gap: 2px; margin-top: 4px; }
.pips i { width: 10px; height: 6px; background: var(--ink-600); }
.pips i.on { background: var(--gold-400); box-shadow: inset 0 -2px 0 var(--gold-700); }
.attr.esp .pips i.on { background: var(--purple-300); box-shadow: inset 0 -2px 0 var(--purple-800); }
.skills { list-style: none; margin: 0; padding: 0; display: grid; }
.skills li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 5px 4px; border-bottom: 1px dotted var(--ink-600); }
.skills li:nth-child(odd) { background: rgba(255,255,255,.02); }
.skills .sn { font-size: var(--fs-xs); }
.skills .sa { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.skills .zero .sn, .skills .zero .sa { color: var(--ink-400); }
.skills .pips i { width: 8px; height: 8px; }
.linkish { background: none; border: 0; color: var(--gold-200); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; font-size: var(--fs-xs); justify-self: start; }
.sheet .foot { padding: var(--s2); }
.sheet .foot .btn { width: 100%; }

/* ficha completa com abas */
.dlg-back { position: fixed; inset: 0; z-index: 50; background: rgba(14,9,17,.78); display: grid; place-items: center; padding: 16px; }
.dlg { background: var(--surface); border: 4px solid var(--frame); box-shadow: var(--shadow); width: min(560px, 100%); max-height: 92%; overflow: auto; display: flex; flex-direction: column; }
.dlg.wide { width: min(900px, 100%); height: min(640px, 92%); }
.dlg h3 { margin: 0; padding: 12px var(--s2); color: var(--accent); font-size: var(--fs-sm); letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--ink-950); }
.dlg .in { padding: var(--s2); display: grid; gap: 14px; }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.fsheet { display: grid; grid-template-columns: 220px minmax(0,1fr); flex: 1; min-height: 0; }
.fs-side { background: linear-gradient(180deg, var(--ink-700), var(--ink-900)); border-right: 3px solid var(--ink-950); padding: var(--s2); display: grid; gap: 12px; align-content: start; justify-items: center; text-align: center; overflow: auto; }
.fs-tabs { display: grid; gap: 4px; width: 100%; margin-top: 8px; }
.fs-tabs button { text-align: left; background: var(--ink-900); border: 2px solid var(--ink-600); padding: 8px 12px; min-height: 40px; display: flex; gap: 8px; align-items: center; }
.fs-tabs button svg { width: 16px; height: 16px; color: var(--gold-200); }
.fs-tabs button[aria-selected="true"] { background: var(--parch-200); color: var(--brown-900); border-color: var(--gold-400); }
.fs-tabs button[aria-selected="true"] svg { color: var(--red-800); }
.fs-main { overflow: auto; min-height: 0; padding: var(--s3); display: grid; gap: var(--s2); align-content: start; background: var(--parch-200); color: var(--brown-900);
  --sb-track: var(--parch-300); --sb-thumb: var(--brown-700); --sb-hi: var(--parch-500); --sb-lo: var(--brown-900); }
.fs-main h4 { margin: 0; font-family: var(--font-serif); font-size: var(--fs-xl); font-weight: 600; border-bottom: 3px double var(--parch-500); padding-bottom: 4px; }
.fs-main .sec-title { color: var(--red-800); }
.fs-main .sec-title::after { background: repeating-linear-gradient(90deg, var(--parch-500) 0 4px, transparent 4px 8px); }
.fs-main .attr { background: var(--parch-100); border-color: var(--parch-500); box-shadow: none; }
.fs-main .attr .gem { background: var(--parch-200); color: var(--brown-900); border-color: var(--brown-700); }
.fs-main .attr.esp .gem { color: var(--purple-800); border-color: var(--purple-500); }
.fs-main .pips i { background: var(--parch-300); }
.fs-main .skills li { border-color: var(--parch-500); }
.fs-main .skills li:nth-child(odd) { background: rgba(92,66,48,.06); }
.fs-main .skills .sa, .fs-main .track .legend, .fs-main .track .top-line em { color: var(--brown-700); }
.fs-main .track.v .tname { color: #8a1c12; } .fs-main .track.w .tname { color: #1c3f86; }
.fs-main .skills .zero .sn, .fs-main .skills .zero .sa { color: var(--parch-500); }
.fs-main .skills.two { grid-template-columns: 1fr 1fr; column-gap: var(--s3); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 14px; margin: 0; }
.kv dt { font-size: var(--fs-xs); color: var(--brown-700); letter-spacing: .06em; text-transform: uppercase; padding-top: 3px; }
.kv dd { margin: 0; font-family: var(--font-serif); font-size: var(--fs-md); }
.kv .new { font-family: var(--font-pixel); font-size: 11px; color: var(--purple-500); margin-left: 6px; text-transform: none; letter-spacing: 0; }
.prose { font-family: var(--font-serif); font-size: var(--fs-md); margin: 0; line-height: 1.5; }
.goalcard { border: 2px solid var(--parch-500); background: var(--parch-100); padding: 12px 14px; display: grid; gap: 4px; }
.goalcard small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--red-800); }
.goalcard p { margin: 0; font-family: var(--font-serif); font-size: var(--fs-lg); line-height: 1.3; }
.goalcard .meta { font-size: var(--fs-xs); color: var(--brown-700); }
.convcard { border: 2px solid var(--parch-500); background: var(--parch-100); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.convcard p { margin: 0; font-family: var(--font-serif); font-size: var(--fs-lg); }
.convcard .pillar { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--brown-700); }
.cracks { display: flex; gap: 3px; }
.cracks svg { width: 18px; height: 18px; }
.places { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.places li { border: 2px solid var(--ink-600); padding: 6px 10px; display: flex; justify-content: space-between; gap: 8px; }
.places li.here { border-color: var(--gold-400); }
.tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 0 6px; border: 2px solid currentColor; color: var(--green-300); }
.crop { display: grid; grid-template-columns: 260px 1fr; gap: var(--s2); align-items: start; }
.crop-stage { position: relative; width: 260px; height: 260px; background: var(--ink-950) repeating-conic-gradient(var(--ink-800) 0 25%, var(--ink-900) 0 50%) 0 0 / 20px 20px; overflow: hidden; touch-action: none; cursor: grab; border: 3px solid var(--frame); }
.crop-stage canvas { position: absolute; inset: 0; }
.crop-stage .mask { position: absolute; inset: 0; pointer-events: none; background: rgba(14,9,17,.65); clip-path: polygon(0 0,100% 0,100% 100%,0 100%,0 0, 15% 15%, 15% 85%, 85% 85%, 85% 15%, 15% 15%); }
.crop-stage .guide { position: absolute; inset: 15%; pointer-events: none; outline: 2px dashed var(--gold-200); }
.crop .ctrl { display: grid; gap: 10px; }
.crop input[type=range] { width: 100%; accent-color: var(--gold-400); }
.crop .file { border: 2px dashed var(--frame); padding: 10px; font-size: var(--fs-xs); display: grid; gap: 6px; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink-950); border: 2px solid var(--gold-400); padding: 8px 14px; font-size: var(--fs-xs); }

/* controles do protótipo */
.proto { position: fixed; z-index: 45; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; }
.proto > button { background: repeating-linear-gradient(135deg, #000 0 8px, #15121a 8px 16px); border: 2px dashed var(--ink-400); color: var(--gold-200); padding: 6px 10px; font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; }
.proto .box { margin-bottom: 8px; background: var(--ink-950); border: 2px dashed var(--ink-400); padding: 10px; display: grid; gap: 8px; font-size: var(--fs-xs); color: var(--muted); max-width: min(560px, calc(100vw - 32px)); }
.proto .box > span { display: grid; gap: 4px; }
.seg { display: inline-flex; border: 2px solid var(--ink-600); flex-wrap: wrap; }
.seg button { background: transparent; border: 0; padding: 4px 10px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--purple-600); color: var(--ivory-100); }

.mobile-tabs { display: none; }
@media (max-width: 1100px) {
  .game { grid-template-columns: minmax(0,1fr); }
  .mobile-tabs { display: flex; gap: 4px; }
  .mobile-tabs button { flex: 1; }
  .game > .scenes, .game > .sheet { display: none; }
  .game[data-side="cenas"] > .scenes, .game[data-side="ficha"] > .sheet { display: flex; }
  .game[data-side="cenas"] > .stage, .game[data-side="ficha"] > .stage { display: none; }
  .stage { min-height: 70vh; }
  .top { flex-wrap: wrap; }
  .top .jname span, .model-btn small, .period-trail .day { display: none; }
  .fsheet, .crop { grid-template-columns: minmax(0,1fr); }
  .fs-main .skills.two { grid-template-columns: 1fr; }
}

/* ---------------------------------------- Estado da Cena e dúvida de continuidade (ADR-078, proposta) */
.stp { background: var(--ink-800); border: 3px solid var(--ink-600); padding: 8px 10px; display: grid; gap: 3px; align-content: start; } .stp-h { display: flex; align-items: center; gap: 8px; font-family: var(--font-serif); font-size: var(--fs-lg); color: var(--gold-200); }
.stgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; } .stcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 20px; }
.stag { font: 600 11px/1 var(--font-pixel); background: var(--purple-600); padding: 3px 6px; color: var(--ivory-100); }
.str { display: grid; grid-template-columns: 5.2em minmax(0, 1fr) auto; gap: 6px; align-items: start; padding: 2px 0; border-top: 1px dashed var(--ink-600); font-size: var(--fs-xs); } .str.chg { background: rgba(240,192,80,.08); }
.stk { color: var(--muted); } .stv { font-family: var(--font-serif); font-size: var(--fs-md); line-height: 1.25; color: var(--ivory-100); } .stnew, .stfix { font: 600 10px/1 var(--font-pixel); font-style: normal; padding: 2px 5px; margin-left: 4px; } .stnew { background: var(--gold-400); color: var(--ink-950); } .stfix { background: var(--green-700); color: var(--ivory-100); }

<script>
/* ----------------------------------------------- ícones em pixel a partir de grades */
function px(rows, pal, extra = "") {
  const h = rows.length, w = rows[0].length; let r = "";
  rows.forEach((row, y) => { for (let x = 0; x < w; x++) { const c = row[x]; if (c !== "." && pal[c]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`; } });
  return `<svg class="px" viewBox="0 0 ${w} ${h}" aria-hidden="true" ${extra}>${r}</svg>`;
}
const G = {
  heart: [".XX...XX.", "XHHX.XHHX", "XHWHXHHHX", "XHHHHHHDX", ".XHHHHHDX", "..XHHHDX.", "...XHDX..", "....XX..."],
  heartS: [".XX...XX.", "XHHX.XHHX", "XHWHXHKHX", "XHHHHKHDX", ".XHHKHHDX", "..XKHHDX.", "...XHDX..", "....XX..."],
  heartA: [".XX...XX.", "XKHX.XHKX", "XHKHXHKHX", "XHHKHKHHX", ".XHHKHHX.", "..XKHKX..", "...KHXK..", "....XX..."],
  flame: ["...X....", "..XHX...", "..XHX.X.", ".XHHHXHX", ".XHWHHHX", "XHHWHHHX", "XHWWWHHX", ".XHWHHX.", "..XXXX.."],
  flameS: ["...X....", "..XHX...", "..XHX.X.", ".XHHHXHX", ".XHHHKHX", "XHHHKHHX", "XHHKHHHX", ".XKHHHX.", "..XXXX.."],
  flameA: ["........", "...X....", "..XHX...", ".XHKHX..", ".XKHKHX.", "XHHKHHX.", "XHKHKHHX", ".XHHHHX.", "..XXXX.."],
  crackOn: [".XXXXXX.", "XHHKHHHX", "XHHKKHHX", "XHHHKHHX", "XHHKKHHX", "XHKHHHHX", "XHKHHHHX", ".XXXXXX."],
  crackOff: [".XXXXXX.", "XHHHHHHX", "XHHHHHHX", "XHHHHHHX", "XHHHHHHX", "XHHHHHHX", "XHHHHHHX", ".XXXXXX."],
};
const HP = { full: { X: "#0e0911", H: "#e8604c", W: "#ffd0c0", D: "#8a1c12" }, sup: { X: "#0e0911", H: "#b98a7e", D: "#6d4a44", K: "#2a1b14" }, agr: { X: "#0e0911", H: "#3a2630", K: "#c0392b" } };
const WP = { full: { X: "#0e0911", H: "#9a62c4", W: "#f0d8ff", D: "#45186a" }, sup: { X: "#0e0911", H: "#6e5a80", K: "#170f1a" }, agr: { X: "#0e0911", H: "#2e2233", K: "#c49be3" } };
const iconHeart = (s) => px(s === "full" ? G.heart : s === "sup" ? G.heartS : G.heartA, HP[s]);
const iconWill = (s) => px(s === "full" ? G.flame : s === "sup" ? G.flameS : G.flameA, WP[s]);
const iconCrack = (on) => px(on ? G.crackOn : G.crackOff, on ? { X: "#2a1b14", H: "#e8c69c", K: "#8a1c12" } : { X: "#a77d52", H: "#f8e4c8" });

/* ícones de linha (cor = currentColor) */
const L = (rows) => px(rows, { "#": "currentColor" });

    <div class="field ${disabled ? "off" : ""}"><textarea id="ta" rows="1" placeholder="${placeholder}" ${disabled ? "disabled" : ""} aria-label="Mensagem" aria-controls="slash" aria-haspopup="listbox"></textarea>
    <button class="send improve" data-act="improve" data-tip="Escreva algo para melhorar" aria-label="Escreva algo para melhorar" disabled>${IC.wand}</button>
    ${S.streaming ? `<button class="send" data-act="stop" data-tip="Parar" aria-label="Parar">${IC.stop}</button>` : `<button class="send" data-act="send" data-tip="Enviar" aria-label="Enviar" ${disabled ? "disabled" : ""}>${IC.send}</button>`}</div>
    <div class="field-hint"><span id="fhint" aria-live="polite">${disabled ? "" : HINT}</span></div></div>`;
}
function logHTML(sceneN) {
  const items = sceneN == null ? S.log : S.log.filter((e) => e.scene === sceneN);
  return `<ul class="events">${[...items].reverse().map((e) => `<li><span class="ico">${LOGICON[e.k] || IC.scroll}</span><span><b>${e.k}</b> · ${e.t}<time>${e.at}</time></span></li>`).join("")}</ul>`;
}

/* ---------------------------------------------------------- arcos */
function renderScenes() {
  const el = $("#scenes"); const min = $("#game").dataset.scenes === "min";
  const cur = (s) => (S.viewing != null ? S.viewing === s.n : s.status === "aberta" && S.state === "cena");
  if (S.state === "pendente") { el.innerHTML = `<div class="phead"><h2>Arcos</h2></div><p style="color:var(--muted);font-size:var(--fs-xs);padding:var(--s2);margin:0">A Cena inicial aparece aqui, no primeiro arco.</p>`; return; }
  if (min) {
    el.innerHTML = `<div class="phead" style="padding:6px;justify-content:center"><button class="mini" data-act="scenes-max" data-tip="Expandir" aria-label="Expandir">${IC.chevR}</button></div>
      <div class="scroll"><div class="rail">${S.arcs.map((a, ai) => `${ai ? "<hr>" : ""}${S.scenes.filter((s) => s.arc === a.id).map((s) => `<button class="${s.status === "aberta" ? "live" : ""}" aria-current="${cur(s)}" data-goto="${s.n}" data-tip="${s.title}" aria-label="${s.title}">${PERIOD_ICONS[s.period]}</button>`).join("")}`).join("")}</div></div>`;
    return;
  }
  el.innerHTML = `<div class="phead"><h2>Arcos</h2><button class="mini" data-act="scenes-min" data-tip="Recolher" aria-label="Recolher">${IC.chevL}</button></div>
    <div class="scroll">${S.arcs.map((a, ai) => {
      const list = S.scenes.filter((s) => s.arc === a.id);
      return `<details class="arc ${a.status === "ativa" ? "" : "old"}" ${a.status === "ativa" ? "open" : ""}><summary><span class="lab">Arco ${ai + 1}${a.status === "ativa" ? "" : " · " + a.status}</span><span class="amb">${a.text}</span><span class="st">${list.length} Cena${list.length === 1 ? "" : "s"}</span></summary>
        <ol>${list.length ? list.map((s) => `<li><button class="scene-card ${s.status === "aberta" ? "live" : ""}" aria-current="${cur(s)}" data-goto="${s.n}" title="${PLABEL[s.period]} · ${s.place}">${PERIOD_ICONS[s.period]}<span class="ttl">${s.title}</span><span class="sr">${s.status === "aberta" ? "(em andamento)" : "(encerrada)"}</span></button></li>`).join("")
          : `<li style="font-size:var(--fs-xs);color:var(--muted);padding:4px 8px">As próximas Cenas entram aqui.</li>`}</ol></details>`;
    }).join("")}</div>`;
}

/* ---------------------------------------------------------- centro */
function tools(kind) {
  const b = (center, icon, tip, pressed, extra = "") => `<button class="icon-btn" data-center="${center}" aria-pressed="${pressed}" data-tip="${tip}" aria-label="${tip}">${icon}${extra}</button>`;
  if (S.state === "fora") return `<div class="head-tools">${b("fora", IC.quill, "Aduran", S.center !== "log")}${b("log", IC.scroll, "Log da Jornada", S.center === "log")}</div>`;
  return `<div class="head-tools">
    ${kind !== "cena" ? b("cena", IC.back, "Voltar à Cena", false) : ""}
    ${b("aduran", IC.quill, "Aduran (não entra na Cena)", kind === "aduran", S.unread && kind !== "aduran" ? `<span class="badge">${S.unread}</span>` : "")}
    ${b("estado", IC.tabSheet, "Estado da Cena", kind === "estado", S.dbt && S.dbt.status === "aberta" && kind !== "estado" ? `<span class="badge">1</span>` : "")}
    ${b("log", IC.scroll, "Log desta Cena", kind === "log")}
    <span class="sep" aria-hidden="true"></span>
    <button class="icon-btn danger" data-act="close" data-tip="Encerrar Cena" aria-label="Encerrar Cena">${IC.close}</button></div>`;
}
/* sky: "topo" (céu no cabeçalho que se dissolve no pergaminho), "janela" (miniatura emoldurada), "fundo" (cabeçalho transparente sobre o céu) ou falso */
function head(eyebrow, h1, p, t, sky, editable) {
  const title = editable && S.editTitle
    ? `<form class="title-edit" data-form="title"><input id="titlein" value="${h1.replace(/"/g, "&quot;")}" maxlength="80" aria-label="Nome da Cena"><button class="mini" type="submit" aria-label="Salvar nome">✓</button></form>`
    : `<h1>${h1}${editable ? ` <button class="mini pen" data-act="edit-title" data-tip="Renomear a Cena" aria-label="Renomear a Cena">${IC.pen}</button>` : ""}</h1>`;
  return `<div class="stage-head ${sky === "topo" ? "with-sky" : ""} ${sky === "fundo" ? "over-sky" : ""}">${sky === "topo" ? `<canvas class="sky-band" id="skyband"></canvas>` : ""}
    ${sky === "janela" ? `<div class="window"><canvas id="skywin"></canvas></div>` : ""}
    <div class="where"><div class="eyebrow">${eyebrow}</div>${title}<p>${p}</p></div>${t || ""}</div>`;
}
function renderStage() {
  const st = $("#stage"); let view = "cena";
  const sky = ({ topo: "topo", janela: "janela", fundo: "fundo", ambos: "fundo" })[S.pview] || false;
  const pIcon = (p) => PERIOD_ICONS[p];
  if (S.state === "pendente") {
    const off = S.model === "off";
    st.innerHTML = head(`${pIcon("manha")} Arco 1`, "A história ainda não começou", "Norilunde · Manhã", "", sky) + `
      <div class="pending"><div style="color:var(--red-800);width:48px;height:48px;margin:0 auto">${IC.quill}</div>
        <h3>${off ? "Falta preparar o Narrador" : "O Narrador está preparando a Cena inicial"}</h3>
        <p>${off ? "A primeira mensagem da Jornada é do Narrador. Carregue um modelo de IA para que ele escreva a abertura." : "Ele usa o Mundo, o lugar inicial e a história de Ilsa para decidir onde e como tudo começa."}</p>
        ${off ? `<div class="warn">Nenhum modelo de IA carregado. Clique no indicador de modelo, no alto da tela, para configurar.</div><div><button class="btn" data-open="modelos">Configurar modelo</button> <button class="btn primary" disabled>Gerar abertura</button></div>`
              : `<div><button class="btn primary" data-act="gen">Gerar abertura</button></div>`}</div>` + composer("Você poderá escrever depois que o Narrador abrir a Cena.", true);
    if (sky) S._skyPeriod = "manha";
  } else if (S.viewing != null) {
    const s = S.scenes.find((x) => x.n === S.viewing);
    st.innerHTML = head(`${pIcon(s.period)} ${PLABEL[s.period]} · encerrada`, s.title, `${s.place} · ${s.motive}`, "", sky) + `
      <div class="readonly"><span>Cena encerrada. Você pode ler, mas não escrever.</span><button class="btn ghost" data-act="back">Voltar ao chat atual</button></div>
      <div class="log">${s.msgs.map((m, i, l) => msgHTML(m, i, l, { readonly: true })).join("")}<div class="summary"><span class="eyebrow">Resumo da Cena</span>${s.summary}</div></div>`;
    S._skyPeriod = s.period;
  } else if (S.state === "cena") {
    const s = openScene();
    const eb = `${pIcon(S.period)} ${PLABEL[S.period]} · ${s.place}`;
    if (S.center === "cena") {
      st.innerHTML = head(eb, s.title, s.motive, tools("cena"), sky, true) + `<div class="log" id="mainlog">${s.msgs.map((m, i, l) => msgHTML(m, i, l)).join("")}</div>` + composer("O que Ilsa faz?");
    } else if (S.center === "aduran") {
      view = "margem";
      st.innerHTML = head(`Durante a Cena · ${s.title}`, "Aduran", "Dúvidas e regras. O que você fala aqui não entra na Cena.", tools("aduran"), false) +
        `<div class="log" id="mainlog">${S.aduran.slice(0, 2).map((m, i, l) => msgHTML(m, i, l, { aduran: true })).join("")}</div>` + composer("Pergunte ao Aduran…");
    } else if (S.center === "estado") {
      view = "margem";
      st.innerHTML = head(`Cena · ${s.title}`, "Estado da Cena", "O que o Narrador tem como verdade agora. Corrija o que estiver errado.", tools("estado"), false) + `<div class="scroll">${estadoHTML()}</div>`;
    } else {
      view = "margem";
      st.innerHTML = head(`Cena · ${s.title}`, "Log da Cena", "Só o que aconteceu nesta Cena. Depois, também rolagens e memórias.", tools("log"), false) + `<div class="scroll">${logHTML(s.n)}</div>`;
    }
    S._skyPeriod = S.period;
  } else if (S.center === "log") {
    view = "margem";
    st.innerHTML = head("Fora de Cena", "Log da Jornada", "Tudo o que o motor registrou, de todas as Cenas.", tools(), false) + `<div class="scroll">${logHTML(null)}</div>`;
  } else {
    view = "margem";
    st.innerHTML = head(`Fora de Cena · ${S.place} · ${PLABEL[S.period]}`, "Aduran", "Diga o que Ilsa fará a seguir. O Aduran decide se isso pede uma Cena.", tools(), false) + `
      <div class="log" id="mainlog">${S.aduran.map((m, i, l) => msgHTML(m, i, l, { aduran: true })).join("")}
      ${S.proposal ? `<div class="proposal" role="group" aria-label="Proposta de Cena"><span class="eyebrow">Proposta de Cena</span>
        <dl><dt>Título</dt><dd>Neblina no Porto Velho</dd><dt>Lugar</dt><dd>Becos do Porto Velho <span class="new-place">lugar novo</span></dd><dt>Motivo</dt><dd>Seguir os homens de capa cinzenta quando deixarem o Corvo Manco</dd><dt>Quem</dt><dd>Dois homens de capa cinzenta</dd></dl>
        <div class="row"><button class="btn primary" data-act="start">Começar a Cena</button><button class="btn" data-act="other">Pedir outra</button><button class="btn ghost" data-act="no">Agora não</button></div></div>` : ""}</div>` + composer("Pergunte ou diga o que Ilsa vai fazer…");
  }
  document.documentElement.dataset.view = view;
  const per = S._skyPeriod || S.period;
  st.classList.toggle("sky-bg", view === "cena" && sky === "fundo");
  let bg = $("#stagesky");
  if (view === "cena" && sky === "fundo") { if (!bg) { bg = document.createElement("canvas"); bg.id = "stagesky"; bg.className = "stage-sky"; bg.setAttribute("aria-hidden", "true"); } st.prepend(bg); skyInto(bg, per, 6); }
  const cv = $("#skyband"); if (cv) { skyInto(cv, per, 4); ditherTo(cv, "#f5dbbb", 5); }
  const win = $("#skywin"); if (win) skyInto(win, per, 3);
  const log = $("#mainlog"); if (log) log.scrollTop = log.scrollHeight;
  wireComposer();
  const tf = $('[data-form="title"]'); if (tf) { const inp = $("#titlein"); inp.focus(); inp.select();
    tf.addEventListener("submit", (e) => { e.preventDefault(); const v = inp.value.trim(); if (v) { openScene().title = v; S.log.push({ scene: openScene().n, at: "Dia 1 · " + PLABEL[S.period], k: "Renomeada", t: v }); } S.editTitle = false; render(); });
    inp.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); S.editTitle = false; renderStage(); } }); }
}
function renderTop() {

function cellIcon(kind, state) { return px((kind === "v" ? HEART : FLAME)[state], IPAL[kind][state]).replace('class="px"', `class="px ti ${kind}"`); }
function trackHTML(kind) {
  const max = kind === "v" ? 6 : 7; const [agr, sup] = DMG[S.dmg][kind]; const free = max - agr - sup;

  const name = kind === "v" ? "Vida" : "Vontade";
  const state = agr === max ? (kind === "v" ? "Incapacitado" : "−2 dados em todas as rolagens") : free === 0 ? (kind === "v" ? "Debilitado" : "Trilha cheia") : "";

function fmtHelp() {
  dialog("Formatação do texto", `<p style="margin:0">O texto do chat usa três estilos. O Narrador segue a mesma convenção; o que você escreve também.</p>

    <li><span class="k">Fala</span><span><code>"assim"</code> entre aspas; no chat aparece com travessão e em itálico, no mesmo estilo da ação. O travessão abre a fala e a fecha quando ainda há texto depois dela. ${fmt('Eu pego uma maçã e digo "Tu é feio." Em seguida jogo a maçã nele.')} ${fmt('Tibo: "Eu só entrego, moça."')}</span></li>
    <li><span class="k">Ação</span><span><code>*assim*</code> entre asteriscos; aparece em itálico, no mesmo estilo da fala. ${fmt("*Você pega o envelope.*")}</span></li></ul>
    <p style="margin:0;font-size:var(--fs-xs);color:var(--muted)">No campo de escrita, digite <b>/</b> para inserir as marcas de <b>fala</b> ou <b>ação</b>. Texto sem marca que você escreve conta como ação. O destaque nunca depende só de cor.</p>`);
}
const SLASH = [
  { n: "fala", d: "Aspas: aparece com travessão", o: '"', c: '"' },
  { n: "ação", d: "Asteriscos: aparece em itálico", o: "*", c: "*" },
  { n: "ajuda", d: "Como funciona a formatação" },
];
const slashState = { open: false, i: 0, from: 0, items: [] };
const nz = (x) => String(x).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function slashClose() { slashState.open = false; const m = $("#slash"), ta = $("#ta"); if (m) m.hidden = true; if (ta) { ta.removeAttribute("aria-activedescendant"); ta.setAttribute("aria-expanded", "false"); } }
function slashDraw() {
  const m = $("#slash"), ta = $("#ta"); if (!m || !ta) return;
  m.innerHTML = slashState.items.map((x, i) => `<button type="button" role="option" id="slash-${i}" data-sl="${i}" aria-selected="${i === slashState.i}"><b>/${x.n}</b><span>${x.d}</span></button>`).join("");
  m.hidden = false; ta.setAttribute("aria-expanded", "true"); ta.setAttribute("aria-activedescendant", `slash-${slashState.i}`);
}
function slashUpdate(ta) {
  const before = ta.value.slice(0, ta.selectionStart), m = before.match(/(^|\s)\/([A-Za-zÀ-ÿ]*)$/);
  if (!m) return slashClose();
  const items = SLASH.filter((x) => nz(x.n).startsWith(nz(m[2])));
  if (!items.length) return slashClose();
  slashState.open = true; slashState.items = items; slashState.i = Math.min(slashState.i, items.length - 1); slashState.from = before.length - m[2].length - 1; slashDraw();
}
function slashPick(i) {
  const ta = $("#ta"), it = slashState.items[i]; if (!ta || !it) return;
  const from = slashState.from, to = ta.selectionStart;
  if (it.o) { ta.setRangeText(it.o + it.c, from, to, "end"); const pos = from + it.o.length; ta.setSelectionRange(pos, pos); } else { ta.setRangeText("", from, to, "end"); }
  slashClose(); ta.focus(); grow(ta); syncImprove(); if (!it.o) fmtHelp();
}
function slashKeys(e) {
  if (!slashState.open) return;
  const n = slashState.items.length;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { slashState.i = (slashState.i + (e.key === "ArrowDown" ? 1 : n - 1)) % n; slashDraw(); }
  else if (e.key === "Enter" || e.key === "Tab") slashPick(slashState.i);
  else if (e.key === "Escape") slashClose();
  else return;
  e.preventDefault(); e.stopImmediatePropagation();
}
document.addEventListener("mousedown", (e) => { if (e.target.closest(".slash")) e.preventDefault(); });
document.addEventListener("click", (e) => { const b = e.target.closest("[data-sl]"); if (!b) return; e.stopPropagation(); e.preventDefault(); slashPick(Number(b.dataset.sl)); }, true);

/* Melhorar texto: o modelo reescreve o que o jogador escreveu, sem mudar o que o personagem faz ou diz (exemplo fixo no protótipo). */
S.imp = null; S.improving = false;
function syncImprove() {
  const ta = $("#ta"), b = $('[data-act="improve"]'); if (!b || !ta) return;
  const off = S.model !== "ok", empty = !ta.value.trim();
  b.disabled = off || empty || S.improving || S.streaming || ta.disabled;
  const tip = off ? "Sem modelo carregado" : empty ? "Escreva algo para melhorar" : "Melhorar o texto com o Narrador";
  b.dataset.tip = tip; b.setAttribute("aria-label", tip);
}
function improveText(t) {
  t = t.trim(); const cap = t.charAt(0).toUpperCase() + t.slice(1), end = /[.!?…]$/.test(t) ? "" : ".";
  return /["“*]/.test(t) ? cap : `*Ajeito a capa e respiro fundo.* "${cap}${end}"`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest('[data-act="improve"], [data-act="undoimp"]'); if (!b) return; e.stopPropagation(); e.preventDefault();
  const ta = $("#ta"), hint = $("#fhint"); if (!ta || !hint) return;

  setTimeout(() => {

    t2.readOnly = false; t2.value = improveText(S.imp); grow(t2); if (b2) { b2.classList.remove("busy"); b2.removeAttribute("aria-busy"); }

  }, 1100);
}, true);

    { id: "tab", name: "Taberneiro", f: { Postura: "de pé", Posição: "atrás do balcão", Segura: "um pano úmido", Humor: "resmungão", Sabe: "que Ilsa chegou ontem" }, changed: [] },
  ],
  open: ["De quem é a carta com o selo da garça?", "Quem são os homens de capa cinzenta?", "Ilsa vai pagar o caldo do rapaz?"],
  skills: [{ n: "Estilo noir", ok: true }, { n: "Diálogos de taverna", ok: false }],
};
/* a dúvida de continuidade fica ancorada na última mensagem do Narrador */
const sc3 = () => S.scenes.find((x) => x.n === 3);
sc3().msgs.filter((m) => m.r === "n").at(-1).doubt = true;
S.dbt = { status: "aberta", show: false, q: "Ilsa está de pé ou sentada?", why: "A narração a deixou junto ao balcão, mas você mandou o rapaz sentar à mesa dela. O Narrador acha que ela está sentada.", hyp: "sentada à mesa", ans: null, by: null };
S.doubts = [{ scene: 2, q: "O homem de capa cinzenta era o mesmo que perguntou por Ilsa no cais?", ans: "Sim, o mesmo.", by: "jogador", at: "Dia 1 · Entardecer" }];
const CONTMODE = { sempre: "Sempre perguntar", contradicao: "Só em contradição clara", nunca: "Nunca (o Narrador escolhe e segue)" };
const nowLabel = () => "Dia 1 · Noite";
/* "Sabe" não é um campo do Quadro: só leva à ficha do NPC (ou ao "O que sei" do diário, no caso do jogador) */
function knowsRow(p) {
  return `<div class="str know"><span class="stk">Sabe</span><span class="stv"><button class="linkish" data-d="${p.you ? "sei" : "npc"}" data-id="${p.id}">${p.you ? "ver no diário" : "ver na ficha"}</button></span></div>`;
}
function personHTML(p) {
  return `<div class="stp"><div class="stp-h"><b>${esc2(p.name)}</b>${p.you ? `<span class="stag">você</span>` : `<button class="mini ficha" data-d="npc" data-id="${p.id}" data-tip="Ver a ficha no diário" aria-label="Ver a ficha de ${esc2(p.name)} no diário">ver ficha</button>`}</div>${Object.entries(p.f).map(([k, v]) => {
    if (k === "Sabe") return knowsRow(p);
    const key = `${p.id}|${k}`, editing = S.stEdit === key, chg = p.changed.includes(k), fixed = (p.fixed || []).includes(k);
    return `<div class="str ${chg ? "chg" : ""}"><span class="stk">${k}</span>${editing ? `<form class="stedit" data-cform="${key}"><input id="stin" value="${esc2(v)}" maxlength="80" aria-label="${k} de ${esc2(p.name)}"><button class="mini ok" type="submit" aria-label="Salvar">✓</button><button class="mini" type="button" data-c="stcancel" aria-label="Cancelar">✕</button></form>`
      : `<span class="stv">${esc2(v)}${chg ? ` <i class="stnew">novo</i>` : ""}${fixed ? ` <i class="stfix">corrigido por você</i>` : ""}</span><button class="mini" data-c="stedit" data-key="${key}" data-tip="Isso está errado? Corrija" aria-label="Corrigir ${k} de ${esc2(p.name)}">${IC.pen}</button>`}</div>`;
  }).join("")}</div>`;
}
function doubtsHTML() {
  const cur = S.dbt.status === "aberta" ? [{ cur: true, scene: 3, q: S.dbt.q, at: nowLabel() }] : S.dbt.ans ? [{ cur3: true, scene: 3, q: S.dbt.q, ans: S.dbt.ans, by: S.dbt.by, at: nowLabel() }] : [];
  const all = [...cur, ...S.doubts];
  if (!all.length) return `<p class="stempty">Nenhuma dúvida de continuidade até agora.</p>`;
  return `<ul class="stdb">${all.map((d) => `<li class="${d.cur ? "open" : ""}"><b>${esc2(d.q)}</b><span>${d.cur ? "Aguardando a sua resposta. Escreva no campo do chat." : `Resposta: ${esc2(d.ans)} · ${d.by === "jogador" ? "você" : "o Narrador decidiu"} · Cena ${d.scene} · ${d.at}`}</span>${d.cur || d.cur3 ? `<button class="btn sm" data-c="seechat">Ver no chat</button>` : ""}</li>`).join("")}</ul>`;
}
function estadoHTML() {
  const c = S.sc;
  return `${S.stNote ? `<p class="stnote" role="status">${esc2(S.stNote)}</p>` : ""}
    <p class="stfoot">Memória narrativa, não regra de jogo: o Henduran atualiza depois de cada resposta do Narrador e a envia de volta a ele, para a história não se contradizer. Se algo estiver errado, corrija com o lápis: o Narrador segue o que você disser.</p>
    <div class="sec"><span class="sec-title">Aqui e agora</span><div class="stwhere"><span>${IC.pin} ${esc2(c.place)}</span><span>${esc2(c.moment)} · ${esc2(c.weather)}</span></div></div>
    <div class="sec"><span class="sec-title">Quem está presente</span><div class="stgrid">${c.people.map(personHTML).join("")}</div></div>
    <div class="stcols"><div class="sec"><span class="sec-title">Em aberto</span><ul class="stopen">${c.open.map((o) => `<li>${esc2(o)}</li>`).join("")}</ul></div>
      <div class="sec"><span class="sec-title">Skills desta Cena (${c.skills.filter((s) => s.ok).length} de 3)</span><div class="stsk">${c.skills.map((s, i) => `<span class="skchip ${s.ok ? "" : "pend"}">${esc2(s.n)}${s.ok ? "" : ` <button class="mini" data-c="skok" data-i="${i}" aria-label="Aceitar a skill ${esc2(s.n)}">aceitar</button><button class="mini" data-c="skno" data-i="${i}" aria-label="Recusar a skill ${esc2(s.n)}">não</button>`}</span>`).join("")}</div>
      ${c.skills.some((s) => !s.ok) ? `<small class="stsub">O Aduran sugeriu uma skill para esta Cena. Ela só entra se você aceitar.</small>` : ""}</div></div>
    <div class="sec"><span class="sec-title">Dúvidas de continuidade</span>${doubtsHTML()}</div>`;
}
/* cartão da dúvida: ocupa a largura do chat como uma mensagem; é só um destaque */
function contCard() {
  const d = S.dbt;
  if (d.status === "aberta") return `<article class="msg cont" role="group" aria-label="Dúvida de continuidade"><div class="who">Dúvida de continuidade</div><div class="body"><p><b>${esc2(d.q)}</b> ${esc2(d.why)}</p>
      <p class="contask">Responda no campo de escrita: a sua próxima mensagem responde a esta dúvida e <b>não vai para o chat</b>. Se preferir, deixe o Narrador escolher.</p></div><div class="controw"><button class="btn ghost" data-c="decide">Você decide</button></div></article>`;
  return `<article class="msg cont done" role="group" aria-label="Dúvida de continuidade respondida"><div class="who">Dúvida de continuidade · respondida</div><div class="body"><p><b>${esc2(d.q)}</b></p>
      <p>${d.by === "jogador" ? "Sua resposta" : "O Narrador decidiu"}: <q>${esc2(d.ans)}</q>. Registrada no Estado da Cena e no Log.</p></div><div class="controw"><button class="btn ghost" data-c="hidecard">Fechar</button></div></article>`;
}
const _renderStage = renderStage;
renderStage = function () {
  _renderStage();
  if (S.state !== "cena" || S.center !== "cena") return;
  const lg = $("#mainlog"); if (!lg) return;
  if (S.dbt.status === "aberta") {
    lg.insertAdjacentHTML("beforeend", contCard()); lg.scrollTop = lg.scrollHeight;
    const ta = $("#ta"); if (ta) { ta.placeholder = "Responda à dúvida do Narrador…"; ta.closest(".field")?.classList.add("answering"); }
    const hint = $(".field-hint span"); if (hint) hint.textContent = "Esta mensagem responde à dúvida de continuidade e não aparece no chat.";
  } else if (S.dbt.show) {
    const arts = lg.querySelectorAll(":scope > article.msg"); let anchor = null; sc3().msgs.forEach((m, i) => { if (m.doubt) anchor = arts[i]; });
    (anchor || lg.lastElementChild).insertAdjacentHTML("afterend", contCard());
  }
};
function answerDoubt(raw, by) {
  const text = raw.charAt(0).toLowerCase() + raw.slice(1);
  const d = S.dbt; d.status = "respondida"; d.show = false; d.ans = text; d.by = by;
  const ilsa = S.sc.people[0]; ilsa.f.Postura = text; ilsa.changed = ["Postura"]; ilsa.fixed = by === "jogador" ? ["Postura"] : [];
  S.stNote = by === "jogador" ? `Anotado: Ilsa está ${text}. O Narrador vai seguir isso.` : `O Narrador decidiu: Ilsa está ${text}. Corrija quando quiser.`;
  S.log.push({ scene: 3, at: nowLabel(), k: "Continuidade", t: `Dúvida respondida: Ilsa está ${text}` });
  render(); toast("Dúvida de continuidade respondida");
}
LOGICON["Continuidade"] = IC.doubt;
function contDialog() {
  dialog("Continuidade", `<p style="margin:0 0 10px">Quando o Narrador não tem certeza de um fato (onde alguém está, o que segura), ele pergunta a você em vez de inventar, num cartão no chat. A sua próxima mensagem responde ao cartão.</p>
    <fieldset class="contfs"><legend class="sr">Quando perguntar</legend>${Object.entries(CONTMODE).map(([k, l]) => `<label class="contop"><input type="radio" name="contmode" value="${k}" ${S.contMode === k ? "checked" : ""}> <span><b>${l}</b>${k === "contradicao" ? " <i>(padrão)</i>" : ""}<small>${k === "sempre" ? "Pergunta sempre que faltar um fato." : k === "contradicao" ? "Só quando o texto contradiz o que já foi estabelecido." : "Nunca pergunta; você ainda pode corrigir o Estado da Cena a qualquer momento."}</small></span></label>`).join("")}</fieldset>
    <p style="margin:10px 0 0;font-size:var(--fs-xs);color:var(--muted)">No máximo uma pergunta a cada 6 turnos. Cada dúvida e resposta fica no Log da Cena e na aba Estado da Cena.</p>`);
}
/* a próxima mensagem digitada responde à dúvida (em captura, antes do envio normal) */
function interceptSend(e, ta) {
  if (S.state !== "cena" || S.center !== "cena" || S.dbt.status !== "aberta") return false;
  e.preventDefault(); e.stopPropagation(); const v = (ta.value || "").trim(); if (!v) return true;
  ta.value = ""; answerDoubt(v, "jogador"); return true;
}
document.addEventListener("keydown", (e) => { const ta = e.target.closest && e.target.closest("#ta"); if (ta && e.key === "Enter" && !e.shiftKey && !slashState.open) interceptSend(e, ta); }, true);
document.addEventListener("click", (e) => {
  const send = e.target.closest('[data-act="send"]'); if (send) { const ta = $("#ta"); if (ta && interceptSend(e, ta)) return; }
  const t = e.target.closest("[data-c], [data-act='doubt']"); if (!t) return;
  e.stopPropagation(); e.preventDefault(); const a = t.dataset.c || "doubt";
  if (a === "doubt") { S.dbt.show = true; renderStage(); const c = $(".msg.cont"); if (c) c.scrollIntoView({ block: "center" }); }
  else if (a === "hidecard") { S.dbt.show = false; renderStage(); }
  else if (a === "decide") answerDoubt(S.dbt.hyp, "narrador");
  else if (a === "seechat") { S.center = "cena"; S.viewing = null; if (S.dbt.status !== "aberta") S.dbt.show = true; render(); const c = $(".msg.cont"); if (c) c.scrollIntoView({ block: "center" }); }
  else if (a === "stedit") { S.stEdit = t.dataset.key; renderStage(); const i = $("#stin"); if (i) { i.focus(); i.select(); } }
  else if (a === "stcancel") { S.stEdit = null; renderStage(); }
  else if (a === "skok") { S.sc.skills[Number(t.dataset.i)].ok = true; renderStage(); }
  else if (a === "skno") { S.sc.skills.splice(Number(t.dataset.i), 1); renderStage(); }
  else if (a === "contmenu") { closeCog(); contDialog(); }
  else if (a === "dset") { const v = t.dataset.v; if (v === "aberta") { S.dbt.status = "aberta"; S.dbt.show = false; S.dbt.ans = null; } else if (v === "respondida") { if (S.dbt.status === "aberta") { S.dbt.status = "respondida"; S.dbt.ans = "sentada à mesa"; S.dbt.by = "jogador"; } S.dbt.show = false; } else if (v === "reaberta") { if (S.dbt.status === "aberta") { S.dbt.status = "respondida"; S.dbt.ans = "sentada à mesa"; S.dbt.by = "jogador"; } S.dbt.show = true; S.center = "cena"; } render(); }
}, true);
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-cform]"); if (!f) return; e.preventDefault(); e.stopPropagation();
  const v = f.querySelector("input").value.trim(); if (!v) return;
  const [id, k] = f.dataset.cform.split("|"), p = S.sc.people.find((x) => x.id === id); p.f[k] = v; p.changed = []; p.fixed = [...(p.fixed || []), k]; S.stEdit = null;
  S.stNote = `Corrigido: ${k} de ${p.name}. O Narrador vai seguir isso.`; renderStage();
}, true);
document.addEventListener("change", (e) => { if (e.target.name === "contmode") S.contMode = e.target.value; });
$("#cogmenu").insertAdjacentHTML("afterbegin", `<button role="menuitem" data-c="contmenu">Continuidade<small>Perguntas do Narrador: ${CONTMODE.contradicao.toLowerCase()}</small></button>`);
{
  const box = $("#protobox"), dd = document.createElement("span"); dd.innerHTML = `Diário <span class="seg"><button data-d="tab" data-k="notas">Anotações</button><button data-d="tab" data-k="sei">O que sei</button><button data-d="npc" data-id="tab">NPC</button><button data-d="npc" data-id="capa">NPC pouco conhecido</button><button data-d="npcstats" data-id="maro">Stats parcial</button><button data-d="npcstats" data-id="tab">Stats (pouco)</button></span>`; box.prepend(dd);
  const d = document.createElement("span");
  d.innerHTML = `Dúvida de continuidade <span class="seg"><button data-c="dset" data-v="aberta">Aberta</button><button data-c="dset" data-v="respondida">Respondida</button><button data-c="dset" data-v="reaberta">Respondida e reaberta</button></span>`;
  box.prepend(d);
}
/* ---------------------------------------------------------- Pontos de retorno (salvamentos manuais e automáticos) */
const PT_MAX = 20, PT_AUTO = 5;
S.pts = [
  { id: 1, k: "auto", n: "Início da Cena “A carta da garça”", w: "hoje, 19:42", at: "Taverna do Corvo Manco · Noite, dia 1", m: 14 },
  { id: 2, k: "man", n: "Antes de abrir a carta", w: "hoje, 19:10", at: "Taverna do Corvo Manco · Noite, dia 1", m: 9 },
  { id: 3, k: "auto", n: "Fim da Cena “Costas para o cais”", w: "ontem, 22:05", at: "Cais de Norilunde · Fim de tarde, dia 1", m: 31 },
  { id: 4, k: "man", n: "Chegada à taverna", w: "ontem, 21:30", at: "Taverna do Corvo Manco · Noite, dia 1", m: 22 },
  { id: 5, k: "auto", n: "Início da Jornada", w: "20/11, 18:00", at: "Os portões de Norilunde · Manhã, dia 1", m: 0 },
];
S.ptName = ""; S.ptEdit = null; S.ptConf = null; S.ptNext = 6;
const ptEsc = (x) => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
function ptsDialog() {
  const man = S.pts.filter((x) => x.k === "man").length, full = man >= PT_MAX, c = S.ptConf, hit = c && S.pts.find((x) => x.id === c.id);
  if (c) {
    const T = { load: ["Carregar este ponto?", `Você volta para <b>${ptEsc(hit.n)}</b> (${hit.w}): o chat, a Ficha, o Estado da Cena e o Diário voltam como estavam. O estado de agora é guardado antes num ponto automático, <b>“Antes de carregar”</b>, então dá para desfazer.`, "Carregar", "primary"],
      over: ["Salvar por cima?", `O ponto <b>${ptEsc(hit.n)}</b> passa a guardar o estado de agora. O conteúdo antigo desse ponto se perde.`, "Salvar por cima", "primary"],
      del: ["Excluir este ponto?", `<b>${ptEsc(hit.n)}</b> é apagado do disco e não pode ser desfeito. A Jornada atual não muda.`, "Excluir", "danger"] }[c.a];
    return dialog(T[0], `<p style="margin:0">${T[1]}</p>`, `<button class="btn" data-pt="cancel" id="ptkeep">Cancelar</button><button class="btn ${T[3]}" data-pt="do">${T[2]}</button>`);
  }
  const rows = S.pts.map((x) => {
    const ed = S.ptEdit === x.id;
    return `<li class="ptrow ${x.k}"><div class="ptmain">${ed ? `<form data-ptform="${x.id}" class="ptedit"><input value="${ptEsc(x.n)}" maxlength="60" aria-label="Novo nome do ponto"><button class="btn sm primary">OK</button><button type="button" class="btn sm" data-pt="rencancel">Cancelar</button></form>` : `<b>${ptEsc(x.n)}</b>`}
      <span class="ptmeta"><i class="dtag2 ${x.k}">${x.k === "man" ? "Manual" : "Automático"}</i> ${x.w} · ${ptEsc(x.at)}${x.m ? ` · ${x.m} mensagens` : ""}</span></div>
      <div class="ptacts"><button class="btn sm primary" data-pt="load" data-id="${x.id}">Carregar</button>
      ${x.k === "man" ? `<button class="btn sm" data-pt="over" data-id="${x.id}" data-tip="Guardar o estado de agora neste ponto">Salvar por cima</button><button class="btn sm" data-pt="ren" data-id="${x.id}">Renomear</button><button class="btn sm danger" data-pt="del" data-id="${x.id}" aria-label="Excluir ${ptEsc(x.n)}">Excluir</button>` : ""}</div></li>`;
  }).join("");
  dialog("Pontos de retorno", `<p class="ptlead">Guarde o momento da Jornada e volte a ele quando quiser. O Henduran também guarda pontos sozinho, no início de cada Cena e no fim; os automáticos mais antigos saem (ficam os ${PT_AUTO} últimos).</p>
    <form class="ptnew" data-ptform="new"><label class="sr" for="ptn">Nome do novo ponto</label><input id="ptn" value="${ptEsc(S.ptName)}" maxlength="60" placeholder="${full ? "Limite de pontos manuais atingido" : "Nome do ponto (opcional)"}" ${full ? "disabled" : ""} autocomplete="off"><button class="btn primary" ${full ? "disabled" : ""}>Salvar agora</button></form>
    <p class="pthint">${man} de ${PT_MAX} pontos manuais${full ? ". Exclua um para criar outro." : "."}</p>
    <ul class="ptlist">${rows}</ul>`, `<button class="btn" data-dlg="close">Fechar</button>`, true);
  const i = $("#ptn"); if (i && !S.ptEdit) i.focus();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-pt]"); if (!t) return; e.stopPropagation(); e.preventDefault();
  const a = t.dataset.pt, id = Number(t.dataset.id);
  if (a === "demo") { S.pts = S.pts.filter((x) => x.k === "auto"); for (let q = 1; q <= PT_MAX; q++) S.pts.push({ id: S.ptNext++, k: "man", n: "Ponto " + q, w: "hoje", at: "Taverna do Corvo Manco", m: q }); S.ptConf = null; ptsDialog(); }
  else if (a === "open") { closeCog(); S.ptConf = null; S.ptEdit = null; S.ptName = ""; ptsDialog(); }
  else if (a === "load" || a === "over" || a === "del") { S.ptConf = { a, id }; ptsDialog(); const k = $("#ptkeep"); if (k) k.focus(); }
  else if (a === "cancel") { S.ptConf = null; ptsDialog(); }
  else if (a === "ren") { S.ptEdit = id; ptsDialog(); const i = $(".ptedit input"); if (i) { i.focus(); i.select(); } }
  else if (a === "rencancel") { S.ptEdit = null; ptsDialog(); }
  else if (a === "do") {
    const c = S.ptConf, hit = S.pts.find((x) => x.id === c.id); S.ptConf = null;
    if (c.a === "del") { S.pts = S.pts.filter((x) => x.id !== c.id); toast("Ponto excluído."); }
    else if (c.a === "over") { hit.w = "agora"; hit.m = 18; toast(`“${hit.n}” agora guarda o estado de agora.`); S.pts = [hit, ...S.pts.filter((x) => x !== hit)]; }
    else { const au = { id: S.ptNext++, k: "auto", n: "Antes de carregar", w: "agora", at: "Taverna do Corvo Manco · Noite, dia 1", m: 18 }; S.pts = [au, ...S.pts]; const autos = S.pts.filter((x) => x.k === "auto"); if (autos.length > PT_AUTO) S.pts = S.pts.filter((x) => x !== autos[autos.length - 1]); toast(`Voltou para “${hit.n}”.`); }
    ptsDialog();
  }
}, true);
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-ptform]"); if (!f) return; e.preventDefault(); e.stopPropagation();
  const v = f.querySelector("input").value.trim();
  if (f.dataset.ptform === "new") {
    if (S.pts.filter((x) => x.k === "man").length >= PT_MAX) return;
    S.pts = [{ id: S.ptNext++, k: "man", n: v || `Ponto de retorno ${S.ptNext}`, w: "agora", at: "Taverna do Corvo Manco · Noite, dia 1", m: 18 }, ...S.pts]; S.ptName = ""; toast("Ponto salvo."); ptsDialog();
  } else { if (!v) return; S.pts.find((x) => x.id === Number(f.dataset.ptform)).n = v; S.ptEdit = null; ptsDialog(); }
}, true);
document.addEventListener("input", (e) => { if (e.target.id === "ptn") S.ptName = e.target.value; });
$("#cogmenu").insertAdjacentHTML("afterbegin", `<button role="menuitem" data-pt="open">Pontos de retorno<small>Salvar e voltar a um momento</small></button>`);
{
  const box = $("#protobox"), pp = document.createElement("span"); pp.innerHTML = `Pontos de retorno <span class="seg"><button data-pt="open">Abrir</button><button data-pt="demo">Limite manual</button></span>`; box.prepend(pp);
}

render();
</script>
