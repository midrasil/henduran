<style>
/* Layout: paisagem viva em tela cheia; título e botões no eixo central; cartão da última Jornada à direita
   sem tirar os botões do centro; rodapé com versão e o indicador do serviço e do modelo (leva a Modelos).
   Tokens de app/src/styles/tokens.css (ADR-069). */
:root {
  color-scheme: dark;
  --ink-950:#0e0911; --ink-900:#170f1a; --ink-800:#221a26; --ink-700:#2e2233; --ink-600:#432e4a; --ink-400:#8d7a93;
  --purple-800:#45186a; --purple-600:#5a2380; --purple-500:#6e3197; --purple-300:#9a62c4;
  --gold-700:#7a4e12; --gold-600:#a8701c; --gold-400:#f0c050; --gold-200:#f8d878;
  --parch-100:#f8e4c8; --parch-200:#f5dbbb; --parch-300:#e8c69c; --parch-500:#a77d52;
  --brown-900:#2a1b14; --brown-700:#5c4230; --ivory-100:#f4e8d4; --ivory-400:#c8b8ac;
  --red-800:#8a1c12; --red-400:#e8604c; --green-300:#7fd88a; --amber-300:#f5b04a; --cyan-300:#6ee7ff;
  --font-pixel: "Pixelify Sans", "Segoe UI", system-ui, sans-serif;
  --font-serif: "Crimson Pro", Georgia, "Times New Roman", serif;
  --shadow: 4px 4px 0 var(--ink-950);
  --pixel-circle: polygon(30% 0,70% 0,70% 5%,80% 5%,80% 10%,90% 10%,90% 20%,95% 20%,95% 30%,100% 30%,100% 70%,95% 70%,95% 80%,90% 80%,90% 90%,80% 90%,80% 95%,70% 95%,70% 100%,30% 100%,30% 95%,20% 95%,20% 90%,10% 90%,10% 80%,5% 80%,5% 70%,0 70%,0 30%,5% 30%,5% 20%,10% 20%,10% 10%,20% 10%,20% 5%,30% 5%);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink-950); color: var(--ivory-100); font-family: var(--font-pixel); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan-300); outline-offset: 3px; }
svg.px { shape-rendering: crispEdges; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.scene { position: fixed; inset: 0; }
#sky { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 55%, rgba(14,9,17,.55) 100%); }

/* moldura da tela: cantos dourados em pixel */
.corner { position: absolute; width: 56px; height: 56px; pointer-events: none; z-index: 3; }
.corner svg { width: 100%; height: 100%; }
.corner.tl { left: 12px; top: 12px; } .corner.tr { right: 12px; top: 12px; transform: scaleX(-1); }
.corner.bl { left: 12px; bottom: 60px; transform: scaleY(-1); } .corner.br { right: 12px; bottom: 60px; transform: scale(-1); }

/* estandartes pendurados nas laterais (simetria) */
.banner { position: absolute; top: 0; width: 72px; z-index: 2; pointer-events: none; }
.banner.l { left: max(48px, 6vw); } .banner.r { right: max(48px, 6vw); }
.banner svg { width: 72px; height: auto; }
.banner .sway { transform-origin: top center; animation: sway 6s ease-in-out infinite; }
.banner.r .sway { animation-delay: -3s; }
@keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }

/* ------------------------------------------------------------- eixo central */
.stage { position: relative; z-index: 4; height: calc(100% - 48px); display: grid; grid-template-rows: auto 1fr; justify-items: center; padding-top: clamp(32px, 9vh, 96px); }
.title { text-align: center; display: grid; justify-items: center; gap: 6px; }
.logo { display: flex; align-items: center; gap: 18px; }
.logo h1 { margin: 0; font-family: var(--font-serif); font-weight: 700; font-size: clamp(3.2rem, 7vw, 5.6rem); line-height: 1; letter-spacing: .01em;
  color: var(--gold-200); text-shadow: 0 3px 0 var(--gold-700), 0 6px 0 var(--ink-950), 4px 8px 0 rgba(0,0,0,.45); }
.logo .mark { width: clamp(44px, 5vw, 64px); }
.logo .mark svg { width: 100%; height: auto; }
.logo .mark.spin svg { animation: glint 5s steps(1) infinite; }
@keyframes glint { 0%, 88% { filter: none; } 90%, 94% { filter: brightness(1.6) drop-shadow(0 0 4px #f8d878); } }
.rule { display: flex; align-items: center; gap: 10px; color: var(--gold-400); }
.rule i { display: block; height: 3px; width: clamp(80px, 14vw, 180px); background: repeating-linear-gradient(90deg, var(--gold-400) 0 6px, transparent 6px 10px); }
.rule svg { width: 14px; height: 14px; }
.subtitle { margin: 0; font-family: var(--font-serif); font-style: italic; font-size: clamp(1.05rem, 1.6vw, 1.3rem); color: var(--parch-100); text-shadow: 2px 2px 0 var(--ink-950); }

.main { position: relative; align-self: center; width: 320px; margin-top: -4vh; }
.buttons { display: grid; gap: 12px; }
.mbtn { position: relative; display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 10px; min-height: 56px; padding: 8px 14px;
  background: linear-gradient(var(--ink-700), var(--ink-800)); border: 3px solid var(--gold-600); color: var(--ivory-100);
  font-family: var(--font-serif); font-size: 1.3rem; font-weight: 600; text-align: center;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 -3px 0 rgba(0,0,0,.35), 4px 4px 0 var(--ink-950); transition: transform 80ms steps(2); }
.mbtn svg { width: 24px; height: 24px; color: var(--gold-200); }
.mbtn:hover { border-color: var(--gold-200); background: linear-gradient(var(--ink-600), var(--ink-700)); transform: translateY(-2px); }
.mbtn:hover::before, .mbtn:focus-visible::before, .mbtn:hover::after, .mbtn:focus-visible::after { content: ""; position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; background: var(--gold-200); clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); }
.mbtn:hover::before, .mbtn:focus-visible::before { left: -20px; } .mbtn:hover::after, .mbtn:focus-visible::after { right: -20px; }
.mbtn:active { transform: translateY(1px); }
.mbtn.primary { background: linear-gradient(var(--purple-500), var(--purple-800)); border-color: var(--gold-400); font-size: 1.4rem; min-height: 64px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.35), 0 0 0 3px var(--ink-950), 6px 6px 0 3px var(--ink-950); }
.mbtn.primary:hover { background: linear-gradient(#7d3aab, var(--purple-600)); }
.mbtn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.mbtn[disabled]::before, .mbtn[disabled]::after { display: none; }
.mbtn .sub { grid-column: 1 / -1; font-family: var(--font-pixel); font-size: 12px; font-weight: 400; color: var(--gold-200); margin-top: -4px; }

/* cartão da última Jornada: preso à direita da coluna, sem deslocar o eixo */
.card { position: absolute; left: calc(100% + 56px); top: 50%; transform: translateY(-50%); width: 340px; background: var(--parch-200); color: var(--brown-900);
  border: 4px solid var(--gold-600); box-shadow: 0 0 0 3px var(--ink-950), 6px 6px 0 3px var(--ink-950); }
.card::before, .card::after { content: ""; position: absolute; width: 10px; height: 10px; background: var(--gold-200); box-shadow: 0 0 0 2px var(--ink-950); top: -7px; left: -7px; }
.card::after { left: auto; right: -7px; }
.card h2 { margin: 0; padding: 8px 14px; display: flex; align-items: center; gap: 8px; background: var(--ink-800); color: var(--gold-200); font-size: .875rem; letter-spacing: .12em; text-transform: uppercase; border-bottom: 3px solid var(--gold-600); }
.card h2 svg { width: 16px; height: 16px; }
.card .body { padding: 14px; display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center; }
.portrait { position: relative; width: 88px; height: 88px; }
.portrait .ring { position: absolute; inset: 0; clip-path: var(--pixel-circle); background: var(--gold-200); }
.portrait .ring2 { position: absolute; inset: 4px; clip-path: var(--pixel-circle); background: var(--gold-700); }
.portrait .pic { position: absolute; inset: 8px; clip-path: var(--pixel-circle); background: var(--purple-800); display: grid; place-items: center; overflow: hidden; }
.portrait .pic b { font-family: var(--font-serif); font-size: 1.9rem; color: var(--gold-200); }
.portrait .pic canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.jn { font-family: var(--font-serif); font-weight: 700; font-size: 1.3rem; line-height: 1.1; }
.facts { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; font-size: .875rem; color: var(--brown-700); }
.facts li { display: flex; gap: 6px; align-items: center; }
.facts svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--red-800); }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px; border-top: 2px dashed var(--parch-500); font-size: .8rem; color: var(--brown-700); }
.card .foot button { background: none; border: 0; color: var(--red-800); text-decoration: underline; text-underline-offset: 3px; font-size: .8rem; padding: 4px 0; }
.card.empty .body { display: block; font-family: var(--font-serif); font-size: 1.05rem; }
.card .warn { margin: 0 14px 12px; padding: 6px 10px; border: 2px solid var(--brown-700); background: rgba(245,176,74,.25); font-size: .8rem; }

/* rodapé */
.foot-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ink-950); border-top: 4px solid var(--gold-600); box-shadow: inset 0 2px 0 var(--gold-200); font-size: .875rem; }
.foot-bar .ver { color: var(--ivory-400); display: flex; gap: 8px; align-items: center; }
.foot-bar .ver svg { width: 16px; height: 16px; }
.foot-bar .mid svg { width: 18px; height: 18px; }
.status { justify-self: end; display: flex; align-items: center; gap: 8px; color: var(--ivory-400); background: transparent; border: 0; padding: 0; min-height: 0; }
.status:hover { color: var(--ivory-100); }
.status:hover .go { text-decoration: underline; }
.status .led { width: 10px; height: 10px; box-shadow: 0 0 0 2px var(--ink-950); }
.status[data-s="ok"] .led { background: var(--green-300); }
.status[data-s="warn"] .led { background: var(--amber-300); animation: blink 1.2s steps(1) infinite; }
.status[data-s="off"] .led { background: var(--red-400); }
@keyframes blink { 50% { opacity: .3; } }
.status small { color: var(--ivory-400); }
.status .sep { color: var(--ivory-400); }
.status .go { color: var(--gold-200); white-space: nowrap; }

/* controles do protótipo */
.proto { position: fixed; z-index: 20; left: 16px; bottom: 60px; }
.proto > button { background: repeating-linear-gradient(135deg, #000 0 8px, #15121a 8px 16px); border: 2px dashed var(--ink-400); color: var(--gold-200); padding: 6px 10px; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; }
.proto .box { margin-bottom: 8px; background: var(--ink-950); border: 2px dashed var(--ink-400); padding: 10px; display: grid; gap: 8px; font-size: .8rem; color: var(--ivory-400); max-width: min(520px, calc(100vw - 32px)); }
.proto .box > span { display: grid; gap: 4px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--ink-600); }
.seg button { background: transparent; border: 0; padding: 4px 10px; color: var(--ivory-400); }
.seg button[aria-pressed="true"] { background: var(--purple-600); color: var(--ivory-100); }
.toast { position: fixed; z-index: 30; left: 50%; bottom: 64px; transform: translateX(-50%); background: var(--ink-950); border: 2px solid var(--gold-400); padding: 8px 14px; font-size: .875rem; }

@media (max-width: 1180px) {
  .main { margin-top: 0; }
  .card { position: static; transform: none; width: 100%; margin-top: 24px; }
  .stage { overflow: auto; padding-bottom: 24px; }
  .banner { display: none; }
}
@media (prefers-reduced-motion: reduce) { .banner .sway, .logo .mark.spin svg, .status .led { animation: none !important; } .mbtn { transition: none; } }
</style>

<script>
/* ------------------------------------------------------------ ícones em pixel */
function px(rows, pal) { let r = ""; rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const c = row[x]; if (c !== "." && pal[c]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`; } }); return `<svg class="px" viewBox="0 0 ${rows[0].length} ${rows.length}" aria-hidden="true">${r}</svg>`; }
const L = (rows) => px(rows, { "#": "currentColor" });
const IC = {
  star: L(["...#....", "...#....", "..###...", "########", "..###...", ".##.##..", ".#...#..", "........"]),
  sword: L([".......#", "......##", ".....##.", "#...##..", ".#.##...", "..##....", ".#.#....", "#...#..."]),
  book: L(["........", "###..###", "#..##..#", "#..##..#", "#..##..#", "#..##..#", "########", "........"]),
  door: L(["######..", "#....#..", "#....#.#", "#..#.###", "#...###.", "#..#.#..", "#....#..", "######.."]),
  person: L(["..##....", ".####...", ".####...", "..##....", ".####...", "######..", "######..", "........"]),
  pin: L(["..####..", ".#....#.", ".#.##.#.", ".#....#.", "..#..#..", "..#..#..", "...##...", "...##..."]),
  clock: L(["..####..", ".#....#.", "#...#..#", "#...#..#", "#..##..#", "#......#", ".#....#.", "..####.."]),
  scroll: L([".######.", "#......#", ".#.####.", ".#......", ".#.####.", ".#......", "#......#", ".######."]),
  dia: px(["...#...", "..#.#..", ".#...#.", "#..#..#", ".#...#.", "..#.#..", "...#..."], { "#": "#f0c050" }),
};
const MARK = px([
  "......#......", "......#......", ".....###.....", "..#..###..#..", "...#.###.#...", "....#####....", "#############", "....#####....", "...#.###.#...", "..#..###..#..", ".....###.....", "......#......", "......#......"],
  { "#": "#f8d878" });
const CORNER = px(["##########", "#GGGGGGGG#", "#G########", "#G#.......", "#G#.......", "#G#.......", "#G#.......", "#G#.......", "#G#.......", "###......."].map((r) => r.replace(/G/g, "g")), { "#": "#a8701c", g: "#f8d878" });
function bannerSVG(color, dark) {
  const rows = ["##############", "#GGGGGGGGGGGG#", "#CCCCCCCCCCCC#", "#CCCCCCCCCCCC#", "#CCCCCYYCCCCC#", "#CCCCYYYYCCCC#", "#CCCYYYYYYCCC#", "#CCCCYYYYCCCC#", "#CCCCCYYCCCCC#", "#CCCCCCCCCCCC#", "#CCCCCCCCCCCC#", "#DCCCCCCCCCCD#", "#DCCCCCCCCCCD#", "#DDCCCCCCCCDD#", "#.DDCCCCCCDD.#", "#..DDCCCCDD..#", "#...DDCCDD...#", "#....DDDD....#", "#.....##.....#"];
  const fixed = rows.map((r) => r.replace(/^#|#$/g, (m, i) => (i === 0 ? "." : ".")));
  const rod = "TTTTTTTTTTTTTT";
  return `<div class="sway">${px([rod, ...fixed.map((r) => "." + r.slice(1, -1) + ".")], { T: "#5c4230", G: "#f8d878", C: color, D: dark, Y: "#f0c050", "#": "#0e0911" })}</div>`;
}
const PERIOD_ICONS = {
  madrugada: px(["..........", "......s...", "..MM......", ".MMs......", ".MM.....s.", ".MM.......", ".MMm......", "..MMMm....", "s..MMM....", ".........."], { M: "#b9bfdc", m: "#8f93c0", s: "#8f93c0" }),
  amanhecer: px(["..........", "....p.....", "..........", "...SSSS...", "..SYYYYS..", ".SYYYYYYS.", "HHHHHHHHHH", ".pppppppp.", "..........", ".........."], { S: "#ffc768", Y: "#fff0b8", H: "#a8486f", p: "#de6f6c" }),
  manha: px(["....r.....", ".r......r.", "...SSSS...", "..SYYYYS..", "r.SYYYYS.r", "..SYYYYS..", "...SSSS...", ".r......r.", "....r.....", ".........."], { S: "#fff09a", Y: "#ffffff", r: "#d8ecff" }),
  tarde: px(["..........", "...SSSS...", "..SYYYYS..", ".SYYYYYYS.", ".SYYYYYYS.", "..SYYYYS..", "...SSSS...", "cc......cc", "cccc..cccc", ".........."], { S: "#ffd878", Y: "#fff4c4", c: "#f0e6d0" }),
  entardecer: px(["....s.....", "..........", "..SSSSSS..", ".SOOOOOOS.", "SOYYYYYYOS", "HHHHHHHHHH", ".hhhhhhhh.", "..hhhhhh..", "..........", ".........."], { S: "#ec8a5c", O: "#ffb858", Y: "#ffe7a0", H: "#93407a", h: "#62307a", s: "#d8c4e8" }),
  noite: px(["..s.......", ".......s..", "....MMM...", "...MMWM...", "...MM.....", "...MM.....", "...MMWM..s", "....MMM...", "s.........", "......s..."], { M: "#e4dfc0", W: "#fbf7e2", s: "#f2ecd4" }),
};
const PERIODS = ["madrugada", "amanhecer", "manha", "tarde", "entardecer", "noite"];
const PLABEL = { madrugada: "Madrugada", amanhecer: "Amanhecer", manha: "Manhã", tarde: "Tarde", entardecer: "Entardecer", noite: "Noite" };

/* ------------------------------------------------- céu: mesmo desenho do sky.ts, com camadas animadas */
const SCENES = {
  madrugada: { bands: ["#0b0b24", "#11143a", "#191d4a", "#232a5c", "#2e3468"], body: { kind: "moon", x: 0.16, y: 0.3, r: 0.07, color: "#b9bfdc", core: "#dfe2f4" }, stars: 1.2, starColor: "#8f93c0", far: "#1b1c3e", mid: "#141532", near: "#0c0b1e", light: "#e8c070" },
  amanhecer: { bands: ["#3a2a5c", "#6a3768", "#a8486f", "#de6f6c", "#f39b70", "#f8c07a"], body: { kind: "sun", x: 0.26, y: 0.6, r: 0.08, color: "#ffc768", core: "#fff0b8", halo: "#ffdf98" }, stars: 0.3, starColor: "#e0c0dc", clouds: "#f6b48a", far: "#5c3458", mid: "#432644", near: "#2a1a2e", light: "#ffd890" },

  entardecer: { bands: ["#24173f", "#3d2160", "#62307a", "#93407a", "#c85c6a", "#ec8a5c", "#f8b868"], body: { kind: "sun", x: 0.72, y: 0.58, r: 0.1, color: "#ffb858", core: "#ffe7a0", halo: "#ffcf7c" }, stars: 0.25, starColor: "#d8c4e8", clouds: "#e98a74", far: "#4a2852", mid: "#331b3c", near: "#1f1227", light: "#ffcf70", flies: true },
